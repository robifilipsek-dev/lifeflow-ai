<style>
:root{
  --mist:#E8EEF0; --paper:#F7FAFA; --ink:#0F2530; --ink2:#4A5F68; --line:#C9D6DA;
  --petrol:#0A5C6B; --petrol-d:#06404B; --petrol-t:#D3E6EA;
  --gold:#F0A500; --gold-t:#FBEBC0;
  --coral:#DD4B25; --coral-t:#F9D8CD;
  --moss:#2E8050; --moss-t:#D5EADC;
  --font-h:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible Next','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--mist);color:var(--ink);font:400 16px/1.5 var(--font-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--font-h);margin:0;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

html,body{overscroll-behavior-y:contain}
body{touch-action:manipulation}
.top-a{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.top-a .btn{min-height:40px}
#app{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 170px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--ink2)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:0 0 auto}
.icon-btn:hover{background:var(--petrol-t);color:var(--petrol-d)}

h2.sec{font-weight:800;font-size:19px;margin:26px 0 10px}
.muted{color:var(--ink2)}

/* buttons */
.btn{font:700 15px var(--font-b);min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--petrol);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--petrol-d)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--petrol-d);box-shadow:inset 0 0 0 1.5px var(--petrol)}
.btn.ghost:hover{background:var(--petrol-t)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn.plain{background:transparent;color:var(--ink2);padding:0 10px;min-height:38px}
.btn.plain:hover{background:var(--petrol-t);color:var(--petrol-d)}

.spin{width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* welcome */
.welcome{padding:6px 0 4px}
.welcome h2{font-size:26px;font-weight:800;margin-bottom:8px}
.welcome p{margin:0 0 10px;max-width:60ch}
.invites{margin:14px 0 0;display:grid;gap:10px}
.invite{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border:0;border-radius:18px;background:var(--paper);cursor:pointer;font:500 16px/1.35 var(--font-b);box-shadow:inset 0 0 0 1.5px var(--line)}
.invite:hover{box-shadow:inset 0 0 0 2px var(--petrol)}
.invite .ico{flex:0 0 48px;height:48px;border-radius:14px;background:var(--petrol);color:#fff;display:grid;place-items:center}
.invite:nth-child(2) .ico{background:var(--gold);color:var(--ink)}
.invite:nth-child(3) .ico{background:var(--moss)}

/* alerts */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 12px 12px 16px;border-radius:14px;margin:0 0 8px;background:var(--ct);box-shadow:inset 6px 0 0 var(--c)}
.alert.bad{--c:var(--coral);--ct:var(--coral-t)}
.alert.warn{--c:var(--gold);--ct:var(--gold-t)}
.alert.info{--c:var(--petrol);--ct:var(--petrol-t)}
.a-body{display:flex;flex-direction:column;min-width:0}
.a-body span{color:var(--ink2);font-size:14.5px}
.a-act{display:flex;gap:4px;flex:0 0 auto}
.alert .btn{background:var(--ink)}
.alert .btn:hover{background:#000}
.alert .btn.plain{background:transparent;color:var(--ink2)}

/* context reminders */
.ctx{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.ctx.two{grid-template-columns:1fr 1fr}}
.ctx h3{font-size:16px;margin:0 0 4px;color:var(--petrol-d)}

/* plan controls */
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.lbl{font-weight:700;min-width:64px}
.seg{display:inline-flex;background:#D5E1E5;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:40px;border-radius:9px;font:700 14px var(--font-b);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(15,37,48,.2)}
.time{display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
input[type=time],input[type=date],input[type=number],input[type=text],input[type=password],select,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%}
.time input{width:auto}
textarea{padding:12px;resize:vertical;min-height:110px}
input:focus,textarea:focus{border-color:var(--petrol)}

.advice{margin:18px 0 4px;padding:12px 14px;border-radius:12px;background:var(--petrol-t);color:var(--petrol-d);font-weight:500}
.warns{margin:8px 0 0;padding-left:20px;color:#8E2C10}

/* flow timeline */
.flow{list-style:none;margin:16px 0 0;padding:0}
.flow li{position:relative;display:grid;grid-template-columns:56px 22px 1fr;align-items:start}
.flow li::before{content:"";position:absolute;left:65px;top:0;bottom:0;width:4px;border-radius:2px;background:var(--petrol-t)}
.flow li:first-child::before{top:16px}
.flow li:last-child::before{bottom:auto;height:16px}
.flow li:only-child::before{display:none}
.flow time{grid-column:1;text-align:right;font:800 15px var(--font-h);padding-top:7px;font-variant-numeric:tabular-nums}
.flow time small{display:block;font:400 12.5px var(--font-b);color:var(--ink2)}
.node{grid-column:2;justify-self:center;width:14px;height:14px;margin-top:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--mist);position:relative;z-index:1}
.blk{grid-column:3;text-align:left;background:transparent;border:0;padding:6px 8px 8px 10px;font:inherit;cursor:pointer;border-radius:10px;min-height:46px}
.blk:hover{background:rgba(255,255,255,.55)}
.blk .t{display:block;font-weight:700}
.blk .k{font-size:13.5px;color:var(--ct)}
.is-done .t{text-decoration:line-through;color:var(--ink2);font-weight:500}
.is-done .node{background:var(--line)}
.tip-opravilo{--c:var(--petrol);--ct:var(--petrol)}

class UserErr extends Error {}
function apiErrText(status, data) {
  const m = (data && data.error && data.error.message) || '';
  if (status === 400 && /API key/i.test(m)) return 'Ključ API ni veljaven. Preveri ga v nastavitvah.';
  if (status === 400) return 'Gemini je zavrnil zahtevo: ' + m;
  if (status === 401 || status === 403) return `Ključ nima dostopa do tega modela (${status}). Preveri ključ in omejitve v Google AI Studio.`;
  if (status === 404) return 'Model ni najden. V nastavitvah preveri ime modela.';
  if (status === 429) return 'Dosežena omejitev zahtev. Počakaj minuto in poskusi znova.';
  if (status >= 500) return 'Gemini je trenutno preobremenjen. Poskusi znova čez nekaj trenutkov.';
  return `Napaka ${status}: ${m}`;
}
function parseJson(t) {
  t = (t || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch (e) { /* fallthrough */ }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* fallthrough */ } }
  throw new UserErr('Odgovora modela nisem mogel razbrati. Poskusi znova.');
}
async function callGemini(parts, extra = '') {
  const key = (S.settings.apiKey || '').trim();
  if (!key) throw new UserErr('NO_KEY');
  const model = (S.settings.model || 'gemini-3.1-flash-lite').trim();
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT + '\n\n' + FORMAT_RULES + (extra ? '\n\n' + extra : '') }] },
    contents: [{ role: 'user', parts }],
    generationConfig: { responseMimeType: 'application/json' }
  };
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 90000);
  const post = m => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify(body),
    signal: ctrl.signal
  });
  try {
    let res = await post(model);
    if (res.status === 404 && !/preview$/.test(model)) {
      const r2 = await post(model + '-preview');
      if (r2.ok) { S.settings.model = model + '-preview'; save(); res = r2; }
    }
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new UserErr(apiErrText(res.status, data));
    const cand = data && data.candidates && data.candidates[0];
    if (!cand) {
      const br = data && data.promptFeedback && data.promptFeedback.blockReason;
      throw new UserErr(br ? `Gemini je vnos blokiral (${br}).` : 'Model ni vrnil odgovora. Poskusi znova.');
    }
    const txt = arr(cand.content && cand.content.parts).filter(p => p.text && !p.thought).map(p => p.text).join('');
    return parseJson(txt);
  } catch (e) {
    if (e instanceof UserErr) throw e;
    if (e.name === 'AbortError') throw new UserErr('Zahteva je potekla. Poskusi znova (manjša slika ali krajši posnetek).');
    throw new UserErr('Ni povezave z Gemini. Preveri internet in poskusi znova.');
  } finally { clearTimeout(to); }
}

function computeAlerts() {
  const out = [];
  S.bills.filter(b => !b.paid && b.due).forEach(b => {
    const d = dayDiff(b.due);
    if (d <= 3) out.push({
      lvl: d <= 1 ? 'bad' : 'warn', sort: d,
      title: `${b.recipient || 'Položnica'}${b.amount != null ? ' · ' + money(b.amount, b.currency) : ''}`,
      text: d < 0 ? `Zapadlo ${rel(d)}` : `Zapade ${rel(d)}`,
      btn: 'Plačano', act: 'pay', id: b.id
    });
  });
  const exp = S.fridge.filter(f => f.expires && dayDiff(f.expires) <= 2).sort((a, b) => a.expires.localeCompare(b.expires));
  if (exp.length) {
    const worst = dayDiff(exp[0].expires);
    out.push({
      lvl: worst <= 0 ? 'bad' : 'warn', sort: worst,
      title: exp.length === 1 ? `${exp[0].name} se izteka` : `${exp.length} živil se kmalu izteka`,
      text: exp.slice(0, 4).map(f => f.name).join(', ') + (exp.length > 4 ? ' …' : ''),
      btn: 'Obroki za danes', act: 'meals'
    });
  }
  S.reminders.filter(r => !r.done && r.trigger === 'cas' && r.at && !r.billId && r.at.slice(0, 10) <= today()).forEach(r => {
    out.push({ lvl: 'info', sort: -0.5, title: r.text, text: `Opomnik · ${r.at.slice(0, 10) === today() ? 'danes ob ' + r.at.slice(11, 16) : 'zamujeno'}`, btn: 'Opravljeno', act: 'doneRem', id: r.id });
  });
  S.deadlines.filter(d => !d.done).forEach(d => {
    const n = dayDiff(d.due);
    if (n <= (d.lead || 14)) out.push({ lvl: n <= 7 ? 'bad' : 'warn', sort: n - 0.3, title: d.title, text: n < 0 ? `Zamujeno ${rel(n)} (${fmtDateY(d.due)})` : `Poteče ${rel(n)} (${fmtDateY(d.due)})`, btn: d.category === 'Garancija' ? 'Skrij' : 'Opravljeno', act: 'doneDl', id: d.id });
  });
  if (deferredPrompt && !isStandalone() && !S.dismissed.install) out.push({ lvl: 'info', sort: 9, title: 'Namesti LifeFlow na telefon', text: 'Odpre se kot prava aplikacija, s svojo ikono.', btn: 'Namesti', act: 'install', dismiss: 'install' });
  const now = new Date();
  const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const mk = today().slice(0, 7);
  if (last - now.getDate() <= 2 && !S.dismissed['subs' + mk]) {
    out.push({ lvl: 'info', sort: 5, title: 'Konec meseca: pregled naročnin', text: 'Preveri, kaj se ti samodejno obnavlja, in ukini, česar ne uporabljaš.', btn: 'Odpri finance', act: 'subs', dismiss: 'subs' + mk });
  }
  return out.sort((a, b) => a.sort - b.sort);
}

async function loadBitmap(file) {
  if ('createImageBitmap' in window) { try { return await createImageBitmap(file); } catch (e) { /* fallback */ } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; });
}
async function compress(file, max = 1600, q = .85) {
  const b = await loadBitmap(file), w = b.width || b.naturalWidth, h = b.height || b.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(b, 0, 0, cw, ch);
  const url = c.toDataURL('image/jpeg', q);
  return { url, b64: url.split(',')[1] };
}

const wStr = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
function abToB64(ab) { let s = ''; const b = new Uint8Array(ab), n = 0x8000; for (let i = 0; i < b.length; i += n) s += String.fromCharCode.apply(null, b.subarray(i, i + n)); return btoa(s); }
async function blobToWav(blob) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
  const a = await ctx.decodeAudioData(buf); ctx.close && ctx.close();
  const len = a.length, chs = a.numberOfChannels, mono = new Float32Array(len);
  for (let c = 0; c < chs; c++) { const d = a.getChannelData(c); for (let i = 0; i < len; i++) mono[i] += d[i] / chs; }
  const rate = 16000, ratio = a.sampleRate / rate, n = Math.floor(len / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const p = i * ratio, i0 = Math.floor(p), i1 = Math.min(i0 + 1, len - 1), f = p - i0;
    out[i] = Math.max(-1, Math.min(1, mono[i0] * (1 - f) + mono[i1] * f)) * 0x7fff;
  }
  const wav = new ArrayBuffer(44 + n * 2), v = new DataView(wav);
  wStr(v, 0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wStr(v, 8, 'WAVE'); wStr(v, 12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); wStr(v, 36, 'data'); v.setUint32(40, n * 2, true);
  new Int16Array(wav, 44).set(out);
  return { b64: abToB64(wav), dur: n / rate };
}
async function toggleRec() {
  if (cap.recording) { if (mr && mr.state !== 'inactive') mr.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Ta brskalnik ne podpira snemanja zvoka. Uporabi besedilo.'); return; }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; mr = new MediaRecorder(recStream);
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearInterval(recTimer); recStream.getTracks().forEach(t => t.stop()); cap.recording = false; updateAttach();
      try { cap.audio = await blobToWav(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })); }
      catch (e) { toast('Posnetka ni bilo mogoče obdelati. Poskusi znova.'); }
      updateAttach();
    };
    cap.recording = true; cap.secs = 0; mr.start();
    recTimer = setInterval(() => { cap.secs++; updateAttach(); if (cap.secs >= 120) mr.stop(); }, 1000);
    updateAttach();
  } catch (e) { toast('Dostop do mikrofona ni dovoljen. Dovoli ga v nastavitvah brskalnika.'); }
}

- V prosta okna nevsiljivo predlagaj rekreacijo, sprostitev ali osebni opravek (npr. plačilo položnice, ki kmalu zapade). Če se živila kmalu iztečejo, predlagaj obrok, ki jih porabi.
- Če so podani predlagani obroki, jih vstavi kot bloke tipa "obrok" ob smiselnih urah (naziv jedi v naslovu).

/* slike računov živijo v IndexedDB (localStorage je premajhen) */
const idb = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('lifeflow-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('img');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('img', mode), req = fn(t.objectStore('img'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  clear() { return this.tx('readwrite', s => s.clear()); }
};
const imgUrls = new Map();
async function imgUrl(id) {
  if (imgUrls.has(id)) return imgUrls.get(id);
  const b = await idb.get(id); if (!b) return null;
  const u = URL.createObjectURL(b); imgUrls.set(id, u); return u;
}
function hydrateImgs(root = document) {
  root.querySelectorAll('img[data-img]:not([src])').forEach(async el => {
    try { const u = await imgUrl(el.dataset.img); if (u) el.src = u; else el.alt = 'Slika ni na voljo'; } catch (e) { el.alt = 'Slika ni na voljo'; }
  });
}

Na slikah je račun, garancijski list ali podobno potrdilo o nakupu (lahko več strani istega dokumenta). Vrni JSON:

Pravila:

async function docAI() {
  if (docForm.busy) return;
  syncDoc();
  if (!(S.settings.apiKey || '').trim()) { docForm.error = 'Za samodejno branje vnesi API ključ v nastavitvah. Podatke lahko vpišeš tudi ročno.'; renderDocForm(); return; }
  docForm.busy = true; docForm.error = null; renderDocForm();
  try {
    const parts = docForm.images.map(i => ({ inlineData: { mimeType: 'image/jpeg', data: i.b64 } }));
    parts.push({ text: docPrompt() });
    const r = await callGemini(parts), f = docForm;
    if (!f.title.trim() && str(r.naziv)) f.title = str(r.naziv);
    if (!f.store.trim() && str(r.trgovina)) f.store = str(r.trgovina);
    if (dt(r.datum)) f.date = dt(r.datum);
    if (!String(f.amount).trim() && num(r.znesek) != null) f.amount = String(num(r.znesek));
    if (!parseInt(f.warranty) && num(r.garancija_mesecev)) f.warranty = String(Math.round(num(r.garancija_mesecev)));
    if (DOC_CATS.includes(r.kategorija)) f.category = r.kategorija;
    if (!f.note.trim() && str(r.opomba)) f.note = str(r.opomba);
    f.aiDone = true;
  } catch (e) { docForm.error = e.message === 'NO_KEY' ? 'Manjka API ključ.' : e.message; }
  docForm.busy = false;
  if (sheet.open && sheet.dataset.kind === 'doc') renderDocForm();
}
async function saveDoc() {
  syncDoc(); const f = docForm;
  if (f.busy) return;
  if (!f.title.trim()) { toast('Vpiši naziv računa.'); return; }
  const id = uid(), imgIds = [];
  let failed = false;
  for (const im of f.images) { const iid = uid(); try { await idb.put(iid, b64ToBlob(im.b64)); imgIds.push(iid); } catch (e) { failed = true; break; } }
  if (imgIds.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const months = parseInt(f.warranty) || 0, until = months && dt(f.date) ? addMonths(f.date, months) : null;
  const doc = { id, title: f.title.trim(), store: f.store.trim() || null, date: dt(f.date), amount: num(f.amount), category: f.category, months, until, note: f.note.trim() || null, images: imgIds };
  S.docs.push(doc);
  if (until) S.deadlines.push({ id: uid(), title: `Garancija poteče: ${doc.title}`, category: 'Garancija', due: until, repeat: 0, lead: 30, note: null, done: false, docId: id });
  save(); sheet.close(); render();
  toast(failed ? 'Račun je shranjen, slike pa ni bilo mogoče shraniti.' : until ? `Shranjeno. Opomnim te 30 dni pred koncem garancije.` : 'Račun je shranjen.');
}
function removeDoc(id) {
  const d = byId(S.docs, id); if (!d) return;
  S.docs = S.docs.filter(x => x.id !== id);
  S.deadlines = S.deadlines.filter(x => x.docId !== id);
  (d.images || []).forEach(iid => { if (!S.docs.some(o => (o.images || []).includes(iid))) { idb.del(iid).catch(() => {}); imgUrls.delete(iid); } });
  save(); render();
}

  capture(b) { openCapture(b.dataset.mode || 'open'); },
  pickCam() { cap.text = ($('#capText') || {}).value ?? cap.text; imgTarget = 'cap'; $('#fileCam').click(); },
  pickGal() { cap.text = ($('#capText') || {}).value ?? cap.text; imgTarget = 'cap'; $('#fileGal').click(); },
  rec() { toggleRec(); },
  rmImg(b) { cap.text = ($('#capText') || {}).value ?? cap.text; cap.images.splice(+b.dataset.i, 1); renderCompose(); },
  rmAud() { cap.audio = null; updateAttach(); },
  analyze() { analyze(); },
  backCompose() { cap.result = null; renderCompose(); },
  apply() { applyResult(); },
  pay(b) {
    const x = byId(S.bills, b.dataset.id); if (!x) return;
    x.paid = !x.paid;
    S.reminders.filter(r => r.billId === x.id).forEach(r => { r.done = x.paid; });
    save(); render(); toast(x.paid ? 'Označeno kot plačano.' : 'Vrnjeno med neplačane.');
  },
  delBill(b) { S.bills = S.bills.filter(x => x.id !== b.dataset.id); S.reminders = S.reminders.filter(r => r.billId !== b.dataset.id); save(); render(); },
  delExp(b) { S.expenses = S.expenses.filter(x => x.id !== b.dataset.id); save(); render(); },
  useFridge(b) { S.fridge = S.fridge.filter(x => x.id !== b.dataset.id); save(); render(); toast('Porabljeno.'); },
  delFridge(b) { S.fridge = S.fridge.filter(x => x.id !== b.dataset.id); save(); render(); },
  mealprep() { S.ui.mealprep = !S.ui.mealprep; save(); render(); },
  mfilter(b) { S.ui.moneyFilter = b.dataset.v; save(); render(); },
  subs(b) { S.ui.tab = 'money'; S.ui.moneyFilter = 'subs'; save(); render(); window.scrollTo(0, 0); },
  dismiss(b) { S.dismissed[b.dataset.key] = true; save(); render(); },
  energy(b) { S.ui.energy = b.dataset.v; save(); render(); },
  plan() { genPlan(); },
  blk(b) {
    const p = S.plan; if (!p) return;
    const bl = p.bloki[+b.dataset.i]; if (!bl) return;
    bl.done = !bl.done;
    if (bl.task_id) { const t = byId(S.tasks, bl.task_id); if (t) t.done = bl.done; }
    save(); render();
  },
  toggleTask(b) { const t = byId(S.tasks, b.dataset.id); if (t) { t.done = !t.done; save(); render(); } },
  delTask(b) { S.tasks = S.tasks.filter(x => x.id !== b.dataset.id); save(); render(); },
  doneRem(b) { const r = byId(S.reminders, b.dataset.id); if (r) { r.done = true; save(); render(); } },
  delRem(b) { S.reminders = S.reminders.filter(x => x.id !== b.dataset.id); save(); render(); },
  quickTask() {
    const i = $('#quickTask'), v = i && i.value.trim(); if (!v) return;
    S.tasks.push({ id: uid(), title: v, prio: 'srednja', frame: null, due: null, time: null, min: null, done: false });
    save(); render(); const n = $('#quickTask'); n && n.focus();
  },
  copy(b) { const v = b.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Kopirano.')).catch(() => toast('Kopiranje ni uspelo.')); },
  showKey(b) { const i = $('#setKey'); i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? 'Pokaži' : 'Skrij'; },
  async testKey(b) {
    if (!(S.settings.apiKey || '').trim()) { toast('Najprej vnesi ključ.'); return; }
    b.disabled = true; b.textContent = 'Preverjam …';
    try { await callGemini([{ text: 'Vrni JSON {"ok":true}' }]); toast('Povezava deluje ✓'); }
    catch (e) { toast(e.message); }
    b.disabled = false; b.textContent = 'Preveri povezavo';
  },
  export() { const o = JSON.parse(JSON.stringify(S)); o.settings.apiKey = ''; download(`lifeflow-kopija-${today()}.json`, JSON.stringify(o, null, 1)); },
  import() { $('#fileImport').click(); },
  wipe() {
    if (!confirm('Res izbrišem vse podatke (položnice, hladilnik, opravila)? Ključ API ostane.')) return;
    const st = S.settings;
    S = JSON.parse(JSON.stringify(DEFAULT)); S.settings = { ...st }; idb.clear().catch(() => {}); imgUrls.clear();
    save(); resetCap(); sheet.close(); render(); toast('Podatki izbrisani.');
  }
};
Object.assign(A, {
  install() { installApp(); },
  meals() { S.ui.tab = 'fridge'; save(); genMeals(); },
  cook() { S.ui.tab = 'fridge'; save(); genMeals(); },
  shopGen() { S.ui.tab = 'fridge'; save(); genShop(); },
  openShop() { S.ui.tab = 'fridge'; save(); render(); setTimeout(() => { const el = $('#shopSec'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); window.scrollTo(0, 0); }, 30); },
  addMissing(b) {
    const m = S.meals && S.meals.obroki[+b.dataset.i]; if (!m) return;
    const n = addToShop(m.manjka); save(); render();
    toast(n ? 'Dodano na nakupovalni seznam.' : 'To je že na seznamu.');
  },
  toggleShop(b) { const i = S.shop && S.shop.items.find(x => x.id === b.dataset.id); if (i) { i.done = !i.done; save(); render(); } },
  delShop(b) { if (S.shop) { S.shop.items = S.shop.items.filter(x => x.id !== b.dataset.id); save(); render(); } },
  clearShop() { if (S.shop) { S.shop.items = S.shop.items.filter(x => !x.done); save(); render(); } },
  quickShop() {
    const i = $('#quickShop'), v = i && i.value.trim(); if (!v) return;
    addToShop([v]); save(); render(); const n = $('#quickShop'); if (n) n.focus();
  }
});
Object.assign(A, {
  dlNew() { openDeadline(null); },
  dlEdit(b) { openDeadline(b.dataset.id); },
  dlPreset(b) {
    syncDl(); const f = dlForm, v = b.dataset.v, p = DL_PRESETS[v];
    if (!f.title.trim() || DL_CATS.includes(f.title.trim())) f.title = v === 'Drugo' ? '' : v;
    f.category = v; f.repeat = String(p.repeat); f.lead = String(p.lead);
    renderDeadline();
  },
  dlSave() { saveDeadline(); },
  dlDel(b) { S.deadlines = S.deadlines.filter(x => x.id !== b.dataset.id); save(); render(); },
  dlDelForm() { S.deadlines = S.deadlines.filter(x => x.id !== dlForm.id); save(); sheet.close(); render(); },
  doneDl(b) {
    const d = byId(S.deadlines, b.dataset.id); if (!d) return;
    if (d.repeat) {
      let nd = addMonths(d.due, d.repeat);
      while (dayDiff(nd) < 0) nd = addMonths(nd, d.repeat);
      d.due = nd; toast(`Opravljeno. Naslednji rok: ${fmtDateY(nd)}`);
    } else { d.done = true; toast('Opravljeno.'); }
    save(); render();
  },
  docNew() { resetDoc(); renderDocForm(); openSheet(null, 'doc'); },
  dfCam() { syncDoc(); imgTarget = 'doc'; $('#fileCam').click(); },
  dfGal() { syncDoc(); imgTarget = 'doc'; $('#fileGal').click(); },
  dfAI() { docAI(); },
  rmDfImg(b) { syncDoc(); docForm.images.splice(+b.dataset.i, 1); renderDocForm(); },
  docSave() { saveDoc(); },
  delDoc(b) { removeDoc(b.dataset.id); toast('Račun izbrisan.'); },
  viewImg(b) {
    openSheet(`<div class="sheet-h"><h2>Račun</h2>${closeBtn}</div><img class="viewimg" data-img="${esc(b.dataset.id)}" alt="Slika računa">`, 'view');
    hydrateImgs($('#sheetBody'));
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = A[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'planFrom') { S.ui.from = tm(e.target.value) || '08:00'; save(); }
  if (e.target.id === 'planTo') { S.ui.to = tm(e.target.value) || '21:00'; save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'quickTask') { e.preventDefault(); A.quickTask(); }
  if (e.key === 'Enter' && e.target.id === 'quickShop') { e.preventDefault(); A.quickShop(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheet.open) render(); });

render();
const qa = new URLSearchParams(location.search).get('a');
if (qa) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } setTimeout(() => openCapture(qa === 'voice' ? 'voice' : 'open'), 80); }
</script>
