function finOpenForm(type,id,template) {
  const old=id?S.finances.find(x=>x.id===id):null;
  if(id&&!old){toast('Vnos ni bil najden.');return;}
  const defaults={id:null,type:type||'subscription',title:template||'',amount:'',category:type==='subscription'?'Naročnine':'Drugo',interval:1,paymentMethod:'auto',startMonth:finUi.month,endMonth:'',date:today(),expiry:'',paid:false,note:''};
  finForm={...defaults,...(old?JSON.parse(JSON.stringify(old)):{})};
  openSheet(finFormHtml(),'finance');
}
function finSaveForm() {
  const f=finReadForm();if(!f)return;
  f.title=String(f.title||'').trim();
  if(!f.title){toast('Vpiši naziv.');return;}
  const n=finBoundedPrice(f.amount);
  if(n===null){toast('Vpiši veljaven znesek v evrih (lahko 0).');return;}
  f.amount=n;
  if(f.type==='subscription'){
    if(!finMonthValid(f.startMonth) || (f.endMonth && (!finMonthValid(f.endMonth)||f.endMonth<f.startMonth))){toast('Preveri začetni in zadnji mesec.');return;}
    f.interval=f.special==='fitinn'?1:Number(f.interval);
    if(!['auto','manual'].includes(f.paymentMethod)){toast('Izberi način plačila.');return;}
    if(![1,3,6,12].includes(f.interval)){toast('Preveri obračunavanje.');return;}
    if(f.special==='fitinn'&&(!finValidDate(f.baseEnd)||(f.noticeSentOn&&!finValidDate(f.noticeSentOn)))){toast('Preveri datum pogodbe ali oddaje odpovedi.');return;}
    f.paidMonths=arr(f.paidMonths);f.pauses=arr(f.pauses);
  }else if(!finValidDate(f.date)){toast('Izberi pravilen datum.');return;}
  else if(f.type==='warranty'&&f.expiry&&(!finValidDate(f.expiry)||f.expiry<f.date)){toast('Garancija ne more poteči pred nakupom.');return;}
  f.note=String(f.note||'').trim();
  if(f.id){const i=S.finances.findIndex(x=>x.id===f.id);if(i<0)return;S.finances[i]=f;}
  else{f.id=uid();S.finances.push(f);}
  finForm=null;finRefreshLinkedDeadlines();save();sheet.close();render();toast('Finance: vnos shranjen.');
}
let finPauseForm=null;
function finPauseOpen(month) {
  const fit=finFit();if(!fit){toast('Članstvo FITINN ni bilo najdeno.');return;}
  const p=finPauseList(fit).find(x=>x.month===month);
  finPauseForm={month:month||finUi.month,oldMonth:p?p.month:null,included:p?!!p.included:false};
  $('#sheetBody').innerHTML='';
  openSheet(`<div class="sheet-h"><h2>${p?'Uredi':'Dodaj'} mirovanje FITINN</h2>${closeBtn}</div>
    <div class="field"><label for="fin_pauseMonth">Mesec mirovanja</label><input id="fin_pauseMonth" type="month" value="${esc(finPauseForm.month)}"></div>
    <label class="fin-check"><input id="fin_pauseIncluded" type="checkbox" ${finPauseForm.included?'checked':''}> To mirovanje je <strong>že upoštevano</strong> v izhodiščnem datumu 31. 3. 2027</label>
    <p class="hint">Če ni že upoštevano, bo podaljšalo pogodbo za en mesec. Za ta mesec se 30 € vadnine ne bo štelo v stroške.</p>
    <p class="fin-warning">Ureditev tukaj je samo osebna evidenca. Mirovanje moraš pravočasno potrditi pri FITINN pred začetkom meseca; velja omejitev do dveh mesecev v ustreznem 12-mesečnem obdobju članstva.</p>
    <div class="fin-form-actions"><button class="btn wide" data-act="finPauseSave">Shrani mirovanje</button>${p?'<button class="btn wide ghost danger" data-act="finPauseDelete">Odstrani mirovanje</button>':''}</div>`, 'finPause');
}
function finPauseSave() {
  const fit=finFit(), f=finPauseForm; if(!fit||!f)return;
  const month=$('#fin_pauseMonth')?.value, included=!!$('#fin_pauseIncluded')?.checked;
  if(!finMonthValid(month)){toast('Izberi mesec mirovanja.');return;}
  if(finPauseList(fit).some(p=>p.month===month&&p.month!==f.oldMonth)){toast('Za ta mesec je mirovanje že vpisano.');return;}
  const pauses=finPauseList(fit).filter(p=>p.month!==f.oldMonth);
  pauses.push({month,included});fit.pauses=pauses;
  finPauseForm=null;finRefreshLinkedDeadlines();save();sheet.close();render();
  const d=finFitDates(fit);
  const recent=pauses.filter(p=>finMonthsApart(month,p.month)>=0&&finMonthsApart(month,p.month)<12).length;
  toast(recent>2?`Shranjeno. Pozor: v zadnjih 12 mesecih so evidentirana ${recent} mirovanja – preveri dovoljeno kvoto pri FITINN.`:`Mirovanje shranjeno. Izračunan konec: ${fmtDateY(d.end)}.`);
}
function finPauseDelete() {
  const fit=finFit(),f=finPauseForm;if(!fit||!f||!f.oldMonth)return;
  fit.pauses=finPauseList(fit).filter(x=>x.month!==f.oldMonth);
  finPauseForm=null;finRefreshLinkedDeadlines();save();sheet.close();render();toast('Mirovanje odstranjeno.');
}

function finDeadlineFor(item,kind) {
  if(!item)return null;
  if(kind==='fitinn' && item.special==='fitinn') return {date:finFitDates(item).cancelBy,title:'FITINN PRO – oddaj odpoved',lead:30,done:!!item.noticeSentOn};
  if(kind==='bill' && item.type==='bill' && finValidDate(item.date)) return {date:item.date,title:'Plačaj račun: '+item.title,lead:7,done:!!item.paid};
  if(kind==='warranty' && item.type==='warranty' && finValidDate(item.expiry)) return {date:item.expiry,title:'Iztek garancije: '+item.title,lead:30,done:false};
  return null;
}
function finRefreshLinkedDeadlines() {
  arr(S.deadlines).forEach(d=>{
    if(!d.financeId || !d.financeKind || d.financeKind==='subscription')return;
    const item=S.finances.find(x=>x.id===d.financeId);
    const val=finDeadlineFor(item,d.financeKind);if(!val)return;
    if(d.due!==val.date){d.due=val.date;d.done=false;}
    // Uporabnikov lasten naziv in trajanje opozarjanja pustimo nespremenjena.
    if(!d.financeCustomTitle)d.title=val.title;
    if(val.done)d.done=true;
  });
}

    .slice().sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
  if(!reminders.length)return '<p class="fin-empty">Ni aktivnih finančnih opomnikov. Naročnine na trajnik ostanejo brez opomnika, dokler ga sam ne nastaviš.</p>';
  return `<div class="fin-rem-list">${reminders.map(d=>`<div class="fin-compact"><div><strong>${esc(d.title)}</strong><small>${esc(fmtDateY(d.due))} · ${d.lead||7} dni prej${d.done?' · zaključeno':''}</small></div><div class="fin-actions"><button class="btn sm ghost" data-act="finRemEdit" data-id="${esc(d.id)}">Uredi</button><button class="btn sm ghost" data-act="finRemDelete" data-id="${esc(d.id)}" aria-label="Odstrani opomnik ${esc(d.title)}">${ic('trash',15)}</button></div></div>`).join('')}</div>`;
}

    ${ref?'<p class="fin-form-help">Datum je povezan z vnosom v Financah in se posodobi, ko spremeniš rok plačila, garancije ali odpovedi FITINN.</p>':'<p class="fin-form-help">Za naročnino brez določenega obračunskega dne vpiši točen datum sam.</p>'}
    <div class="field"><label for="finRem_note">Opomba (neobvezno)</label><textarea id="finRem_note" rows="2" maxlength="1000">${esc(finReminderForm.note)}</textarea></div>
    <p class="fin-form-help">Opozorilo se pokaže v aplikaciji; za zanesljivo opozorilo, ko je aplikacija zaprta, uporabi tudi koledar.</p>
    <div class="fin-form-actions"><button class="btn wide" data-act="finRemSave">Shrani opomnik</button>${linked?`<button class="btn wide ghost danger" data-act="finRemDelete" data-id="${esc(linked.id)}">Odstrani opomnik</button>`:''}</div>`, 'finReminder');
}
function finReminderSave(){
  const f=finReminderForm;if(!f)return;
  const title=String($('#finRem_title')?.value||'').trim(),date=$('#finRem_date')?.value,
        lead=Number($('#finRem_lead')?.value),note=String($('#finRem_note')?.value||'').trim();
  if(!title){toast('Vpiši naziv opomnika.');return;}
  if(!finValidDate(date)){toast('Izberi veljaven datum.');return;}
  if(![1,3,7,14,30,60].includes(lead)){toast('Izberi čas opozorila.');return;}
  const prior=f.id?S.deadlines.find(d=>d.id===f.id):null;
  const ref=finDeadlineFor(f.financeId?S.finances.find(x=>x.id===f.financeId):null,f.financeKind);
  const rec={title,due:ref?.date||date,lead,note,category:f.financeKind==='warranty'?'Garancija':'Drugo',repeat:0,
    financeId:f.financeId,financeKind:f.financeKind,financeManaged:true,financeCustomTitle:!ref||title!==ref.title};
  if(prior){if(prior.due!==rec.due)prior.done=false;Object.assign(prior,rec);}
  else S.deadlines.push({id:uid(),done:false,...rec});
  finReminderForm=null;save();sheet.close();render();toast('Opomnik shranjen med roki.');
}
function finReminderDelete(id){
  const d=S.deadlines.find(x=>x.id===id);if(!d)return;
  if(!confirm('Odstranim opomnik »'+d.title+'«?'))return;
  S.deadlines=S.deadlines.filter(x=>x.id!==id);
  finReminderForm=null;save();sheet.close();render();toast('Opomnik odstranjen.');
}
Object.assign(A, {
  finShift(b){finUi.month=finMonthShift(finUi.month,Number(b.dataset.n)||0);render();},
  finMonth(b){finUi.month=b.dataset.month;render();},
  finFilter(b){finUi.filter=b.dataset.v;render();},
  finNew(b){finOpenForm(b.dataset.type);},
  finTemplate(b){finOpenForm('subscription',null,b.dataset.title);},
  finEdit(b){const x=S.finances.find(x=>x.id===b.dataset.id);if(x)finOpenForm(x.type,x.id);},
  finSave(){finSaveForm();},
  finDelete(b){const x=S.finances.find(v=>v.id===b.dataset.id);if(!x)return;if(!confirm('Izbrišem »'+x.title+'«?'))return;const linked=S.deadlines.filter(d=>d.financeId===x.id);S.finances=S.finances.filter(v=>v.id!==x.id);S.deadlines=S.deadlines.filter(d=>d.financeId!==x.id);finForm=null;save();sheet.close();render();toast('Vnos izbrisan.',()=>{S.finances.push(x);S.deadlines.push(...linked);save();render();});},
  finRemind(b){finReminderOpen(b.dataset.id||null,b.dataset.kind);},
  finRemEdit(b){const d=S.deadlines.find(x=>x.id===b.dataset.id);if(d)finReminderOpen(d.financeId||null,d.financeKind||'free',d.id);},
  finRemSave(){finReminderSave();},
  finRemDelete(b){finReminderDelete(b.dataset.id);},
  finPaid(b){const x=S.finances.find(v=>v.id===b.dataset.id),month=b.dataset.month;if(!x)return;
    if(x.type==='subscription'){if(x.paymentMethod==='auto'||!finEligible(x,month)||x.special==='fitinn'&&finFitPause(x,month))return;const set=new Set(arr(x.paidMonths));set.has(month)?set.delete(month):set.add(month);x.paidMonths=[...set].sort();}
    else if(x.type==='bill')x.paid=!x.paid;
    finRefreshLinkedDeadlines();save();render();},
  finPauseNew(b){finPauseOpen(b.dataset.month||finUi.month);},
  finPauseEdit(b){finPauseOpen(b.dataset.month);},
  finPauseSave(){finPauseSave();},
  finPauseDelete(){finPauseDelete();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='finPickMonth'&&finMonthValid(e.target.value)){finUi.month=e.target.value;render();}
});
/* ========== END FINANCE ========== */

initTheme();
store.set(JSON.stringify(S));
cleanupLegacyImages();
render();
if (fbCfg()) fbInit().catch(() => {});

startReminderMonitoring();
/* sprotno osveževanje oznake »zdaj« v dnevnem načrtu in urnih okvirčkov vremena */
function liveTick() {
  if (document.hidden) return;
  try {
    const el = $('#planFlow');
    if (el && S.plan && S.plan.date === today() && !(sheet && sheet.open)) el.innerHTML = planFlowItems(S.plan);
    if ($('#wxCard') && !wxSt.busy) wxUi();
  } catch (e) { /* ignore */ }
}
setInterval(liveTick, 20000);
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('.row-menu,.row-more')) return;
  document.querySelectorAll('.row-menu:not([hidden])').forEach(x => { x.hidden = true; });
  document.querySelectorAll('.row-more[aria-expanded=true]').forEach(x => x.setAttribute('aria-expanded', 'false'));
});
function autoSyncTick() { if (!document.hidden && gcalOn() && !gtask.syncing && Date.now() - (gtask.lastSync || 0) > 120000) syncGoogleTasks(true); }
setInterval(autoSyncTick, 30000);
setTimeout(autoSyncTick, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoSyncTick(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) liveTick(); });
setTimeout(() => agentAutoStart(false), 700);
setTimeout(() => wxLoad().catch(() => {}), 300);
const qa = new URLSearchParams(location.search).get('a');
if (qa) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } setTimeout(() => openCapture(qa === 'voice' ? 'voice' : 'open'), 80); }
</script>
