:root{
  --mist:#E8EBF0; --paper:#F8F8F9; --ink:#1C1E23; --ink2:#4A5368; --line:#C9CEDA;
  --petrol:#162D5F; --petrol-d:#0F1F42; --petrol-t:#D3DAEA;
  --gold:#F0A500; --gold-t:#FBEBC0;
  --coral:#DD4B25; --coral-t:#F9D8CD;
  --blue:#8FAAE3; --blue-hover:#698CD6; --blue-soft:#DEE6F7; --blue-ink:#132751; --blue-placeholder:#5F6F93;
  --moss:#2E8050; --moss-t:#D5EADC;
  --font-h:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible Next','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--mist);color:var(--ink);font:400 16px/1.5 var(--font-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--font-h);margin:0;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

html,body{overscroll-behavior-y:contain}
body{touch-action:manipulation}
.top-a{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.top-a .btn{min-height:40px}
#app{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 170px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--ink2)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:0 0 auto}
.icon-btn:hover{background:var(--petrol-t);color:var(--petrol-d)}

h2.sec{font-weight:800;font-size:19px;margin:26px 0 10px}
.muted{color:var(--ink2)}

/* buttons */
.btn{font:700 15px var(--font-b);min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--blue);background:var(--blue);color:var(--blue-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--blue-soft);color:var(--blue-ink);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn.ghost:hover{background:var(--blue);border-color:var(--blue)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn.plain{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink);padding:0 10px;min-height:38px}
.btn.plain:hover{background:var(--blue);color:var(--blue-ink)}

.spin{width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* welcome */
.welcome{padding:6px 0 4px}
.welcome h2{font-size:26px;font-weight:800;margin-bottom:8px}
.welcome p{margin:0 0 10px;max-width:60ch}
.invites{margin:14px 0 0;display:grid;gap:10px}
.invite{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border:1.5px solid var(--blue);border-radius:18px;background:var(--blue-soft);cursor:pointer;font:500 16px/1.35 var(--font-b);box-shadow:none;color:var(--blue-ink)}
.invite:hover{background:var(--blue)}
.invite .ico{flex:0 0 48px;height:48px;border-radius:14px;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center}
.invite:nth-child(2) .ico,.invite:nth-child(3) .ico{background:var(--blue);color:var(--blue-ink)}

/* alerts */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 12px 12px 16px;border-radius:14px;margin:0 0 8px;background:var(--ct);box-shadow:inset 6px 0 0 var(--c)}
.alert.bad{--c:var(--coral);--ct:var(--coral-t)}
.alert.warn{--c:var(--gold);--ct:var(--gold-t)}
.alert.info{--c:var(--petrol);--ct:var(--petrol-t)}
.a-body{display:flex;flex-direction:column;min-width:0}
.a-body span{color:var(--ink2);font-size:14.5px}
.a-act{display:flex;gap:4px;flex:0 0 auto}
.alert .btn{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.alert .btn:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.alert .btn.plain{background:var(--blue-soft);border:1.5px solid var(--blue);color:var(--blue-ink)}

/* context reminders */
.ctx{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.ctx.two{grid-template-columns:1fr 1fr}}
.ctx h3{font-size:16px;margin:0 0 4px;color:var(--petrol-d)}

/* plan controls */
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.lbl{font-weight:700;min-width:64px}
.seg{display:inline-flex;background:var(--blue-soft);border:1.5px solid var(--blue);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:40px;border-radius:9px;font:700 14px var(--font-b);color:var(--blue-ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:var(--blue-ink);box-shadow:0 1px 2px rgba(15,37,48,.16)}
.time{display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
input[type=time],input[type=date],input[type=datetime-local],input[type=number],input[type=text],input[type=password],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--blue-soft);border:1.5px solid var(--blue);border-radius:10px;padding:0 12px;min-height:44px;width:100%;accent-color:var(--blue)}
.time input{width:auto}
textarea{padding:12px;resize:vertical;min-height:110px}
input:focus,select:focus,textarea:focus{border-color:var(--blue-hover);box-shadow:0 0 0 3px rgba(88,190,211,.18);outline:none}
::placeholder{color:var(--blue-placeholder);opacity:1}

.advice{margin:18px 0 4px;padding:12px 14px;border-radius:12px;background:var(--petrol-t);color:var(--petrol-d);font-weight:500}
.warns{margin:8px 0 0;padding-left:20px;color:var(--danger-ink)}

/* flow timeline */
.flow{list-style:none;margin:16px 0 0;padding:0}
.flow li{position:relative;display:grid;grid-template-columns:56px 22px 1fr;align-items:start}
.flow li::before{content:"";position:absolute;left:65px;top:0;bottom:0;width:4px;border-radius:2px;background:var(--petrol-t)}
.flow li:first-child::before{top:16px}
.flow li:last-child::before{bottom:auto;height:16px}
.flow li:only-child::before{display:none}
.flow time{grid-column:1;text-align:right;font:800 15px var(--font-h);padding-top:7px;font-variant-numeric:tabular-nums}
.flow time small{display:block;font:400 12.5px var(--font-b);color:var(--ink2)}
.node{grid-column:2;justify-self:center;width:14px;height:14px;margin-top:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--mist);position:relative;z-index:1}
.blk{grid-column:3;text-align:left;background:transparent;border:0;padding:6px 8px 8px 10px;font:inherit;cursor:pointer;border-radius:10px;min-height:46px}
.blk:hover{background:rgba(255,255,255,.55)}
.blk .t{display:block;font-weight:700}
.blk .k{font-size:13.5px;color:var(--ct)}
.is-done .t{text-decoration:line-through;color:var(--ink2);font-weight:500}
.is-done .node{background:var(--line)}
.tip-opravilo{--c:var(--petrol);--ct:var(--petrol)}
.tip-fiksno{--c:var(--ink);--ct:var(--ink2)}
.tip-odmor,.tip-rekreacija{--c:var(--moss);--ct:#1E6B3E}
.tip-opomnik{--c:var(--coral);--ct:#A93815}
.flow li.is-live .blk{box-shadow:0 0 0 2px var(--gold)}
.flow li.now{--c:var(--gold)}
.flow li.now .node{width:9px;height:9px;margin-top:12px;box-shadow:0 0 0 2px var(--paper);border-width:2px}
.flow li.now .pill{grid-column:3;justify-self:start;margin:6px 0 6px 10px;background:var(--gold);color:var(--ink);font-weight:700;font-size:13.5px;padding:2px 12px;border-radius:999px}

/* izboljšan videz: blok, ki poteka, pretekli bloki, vrstice opravil */
.flow li.is-live .blk{background:var(--gold-t);box-shadow:0 0 0 2px var(--gold)}
.flow li.is-past:not(.is-done) .blk{opacity:.55}
.flow li.now{position:relative}
.flow li.now::after{content:"";position:absolute;left:78px;right:0;top:17px;height:2px;background:var(--gold);opacity:.55;z-index:0}
.flow li.now .pill{position:relative;z-index:1}
.live-bar{display:block;height:5px;border-radius:3px;background:rgba(15,37,48,.14);margin-top:6px;overflow:hidden}
.live-bar i{display:block;height:100%;background:var(--petrol);border-radius:3px;transition:width .6s ease}
.row{position:relative;padding-left:10px;transition:background .2s,opacity .25s}
.row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--line)}
.row.prio-visoka::before{background:var(--coral)}
.row.prio-srednja::before{background:var(--gold)}
.row.prio-nizka::before{background:var(--petrol-t)}
.row.done{opacity:.6}
.row.overdue .grow small:first-of-type{color:var(--coral);font-weight:700}
.row.duetoday .grow small:first-of-type{color:var(--petrol-d);font-weight:700}
.row-more b{font-size:24px;line-height:1}
.row{flex-wrap:wrap}
.row-menu{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:2px 0 6px;animation:rmIn .18s ease}
.row-menu[hidden]{display:none}
@keyframes rmIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.wx-hours.three>div{padding:12px 4px;gap:4px}
.wx-hours.three>div span{font-size:30px;line-height:1}
.wx-hours.three>div strong{font-size:20px}
.wx-hours.three>div small:last-child{color:#2A54B0;font-weight:700}
@media (prefers-reduced-motion:reduce){.row-menu,.live-bar i{animation:none;transition:none}}

/* lists */
.list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-height:56px}
.row .grow{flex:1;min-width:0;padding:4px 0}
.row .grow strong{display:block;overflow-wrap:anywhere}
.row small,.sub{color:var(--ink2);font-size:14px}
.row.done .grow strong{text-decoration:line-through;color:var(--ink2);font-weight:500}
.badge{font:700 13px var(--font-b);padding:3px 10px;border-radius:8px;background:var(--moss-t);color:#1E5A37;white-space:nowrap}
.badge.warn{background:var(--gold-t);color:#7A5300}
.badge.bad{background:var(--coral-t);color:var(--danger-ink)}
.badge.plain{background:#DCE0E8;color:var(--ink2)}
.chk{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--petrol);display:grid;place-items:center;color:#fff}
.chk[aria-pressed=true] .circle{background:var(--petrol)}
.mini{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink2);cursor:pointer;flex:0 0 auto;padding:0;touch-action:manipulation}
.mini:hover{background:var(--coral-t);color:var(--danger-ink)}
.cal-action{white-space:nowrap}
.task-source{display:flex;align-items:center;gap:4px;color:var(--blue-ink);font-size:12px!important;font-weight:700}.task-source svg{flex:0 0 auto}.task-rem{display:flex;align-items:center;gap:5px;margin-top:3px;color:var(--ink2);font-size:13px}
.task-rem svg{width:15px;height:15px;flex:0 0 auto}
.task-rem.location{color:var(--petrol-d)}
.empty{padding:26px 4px;color:var(--ink2)}
.empty .btn{margin-top:12px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}

/* money */
.chips{display:flex;gap:8px;margin:14px 0 4px}
.chip{border:1.5px solid var(--blue);min-height:38px;padding:0 14px;border-radius:10px;background:var(--blue-soft);font:700 14px var(--font-b);color:var(--blue-ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
details.bill{border-bottom:1px solid var(--line)}
details.bill summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:60px;cursor:pointer}
details.bill summary::-webkit-details-marker{display:none}
.kv{display:flex;align-items:center;gap:4px;min-height:36px}
.kv span{color:var(--ink2);min-width:74px;font-size:14px}
.kv code{font:500 14.5px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--petrol);min-width:4px}
.bar b{font-variant-numeric:tabular-nums}
details.fold>summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--ink2);min-height:44px}

/* inbox */.hero-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--coral-t);color:var(--danger-ink);font-size:12px;line-height:1}
.inbox-dash{background:linear-gradient(180deg,var(--paper),var(--blue-soft));border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.inbox-mini-list{display:grid;gap:8px;margin-top:8px}
.inbox-mini{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.52);border:1px solid var(--line)}
[data-theme=dark] .inbox-mini{background:rgba(255,255,255,.035)}
.inbox-mini-ico{width:32px;height:32px;border-radius:10px;background:var(--petrol-t);display:grid;place-items:center;color:var(--petrol-d);flex:0 0 auto}
.inbox-mini div{min-width:0}.inbox-mini strong,.inbox-mini small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inbox-mini small{color:var(--ink2);margin-top:2px}
.capture-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.inbox-count{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:999px;background:var(--coral-t);color:var(--danger-ink);font:800 14px var(--font-b);vertical-align:3px}
.inbox-list{display:grid;gap:10px}
.inbox-card{padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 1px 2px rgba(15,37,48,.04)}
.inbox-card-top{display:flex;align-items:center;gap:9px}.inbox-card-ico{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--blue-soft);color:var(--blue-ink);flex:0 0 auto}
.inbox-card-top .grow{min-width:0}.inbox-card-top strong,.inbox-card-top small{display:block;overflow-wrap:anywhere}.inbox-card-top small{color:var(--ink2);font-size:12.5px;margin-top:2px}.inbox-card p{margin:10px 0;color:var(--ink2);font-size:14px;line-height:1.35}
.inbox-card-actions{display:flex;gap:8px}.inbox-empty{text-align:center}.inbox-empty h3{margin:10px 0 3px;font:800 20px var(--font-h)}.inbox-empty-ico{width:68px;height:68px;margin:4px auto 0;border-radius:20px;background:var(--blue-soft);display:grid;place-items:center;color:var(--petrol-d)}
@media(max-width:520px){.capture-actions{grid-template-columns:1fr}.inbox-card-actions{display:grid;grid-template-columns:1fr 1fr}.inbox-card-actions .btn{width:100%}}

.quick-mic{flex:0 0 42px;width:42px;height:42px;border-radius:12px}
.quick-mic.recording{background:var(--coral-t);color:var(--danger-ink);animation:pulse 1s ease-in-out infinite}
@media(max-width:700px){
  .quick-mic{flex:0 0 42px}
}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:6px}.quick select{flex:0 0 150px;min-width:0}
@media (max-width:700px){.quick select{flex:0 0 118px;font-size:13px}.quick input{min-width:0}}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{border:0;background:transparent;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12.5px var(--font-b);color:var(--ink2);cursor:pointer;position:relative}
nav button[aria-current=page]{color:var(--petrol-d);font-weight:700}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:4px;border-radius:0 0 4px 4px;background:var(--petrol)}
.fab{position:fixed;z-index:25;right:max(18px,calc((100vw - 680px)/2 + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:700 16px var(--font-b);display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(15,37,48,.35)}
.fab:hover{background:#000}

/* sheet */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:680px;max-height:92vh;max-height:92dvh;border-radius:26px 26px 0 0;background:var(--paper);color:var(--ink);overflow:auto}
dialog#sheet[open]{animation:up .22s ease-out}
dialog#sheet::backdrop{background:rgba(15,37,48,.5)}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sheet-in{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-h h2{font-size:23px;font-weight:800}
.hint{margin:0 0 12px;color:var(--ink2)}
.lead{margin:0 0 14px;font-size:17px}
.src-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.src{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:16px;border:1.5px solid var(--blue);background:var(--blue-soft);color:var(--blue-ink);font:700 14px var(--font-b);cursor:pointer}
.src:hover{border-color:var(--blue-hover);background:var(--blue)}
.src.on{background:var(--blue);border-color:var(--blue-hover);color:var(--blue-ink)}
.src.on svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:8px 6px 4px 0}
.th{position:relative;flex:0 0 auto}
.th img{display:block;height:84px;width:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.th button{position:absolute;top:-7px;right:-7px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.aud{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--gold-t)}
.aud .btn{margin-left:auto}
.sheet-f{margin-top:16px;display:grid;gap:8px}
.err{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--coral-t);color:var(--danger-ink)}
.busy{display:flex;align-items:center;gap:12px;padding:26px 2px;font-size:17px}
.rvh{font:800 16px var(--font-h);color:var(--petrol-d);margin:18px 0 4px}
.rvl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rv{padding:8px 0;border-bottom:1px solid var(--line)}
.ck{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:4px 0}
.ck input{width:22px;height:22px;accent-color:var(--petrol);margin:2px 0 0;flex:0 0 auto}
.ck .rv-b{display:flex;flex-direction:column;min-width:0}
.ck small{color:var(--ink2);font-size:14px}
.rv-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 0 4px 34px}
.rv-in label{display:grid;gap:2px;font-size:13.5px;color:var(--ink2)}
/* unified quick-add bar */
.qa{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:16px;background:#FAFCFB;margin:0 0 14px}
.qa textarea,.qa input{background:#fff;min-height:48px;margin:0}
.qa textarea{min-height:68px;resize:none;padding:11px 12px;line-height:1.35}
.qa .quick-mic{flex:none;width:48px;height:48px;border-radius:13px}
.qa>.btn{min-height:48px}
.qa-extra{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qa-extra .help{margin:0}
.ctl-row.plan-row{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:14px}
.plan-row .lbl{font-weight:700}
.time-range{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.time-range label.time{display:grid;grid-template-columns:1fr;gap:4px;font-size:13px;font-weight:700}

/* ---------- modern light redesign ---------- */

  --moss:#2E7C58; --moss-t:#E2F1E9;

.welcome.compact-welcome{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin:10px 0 18px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}.welcome-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--petrol-t);color:var(--petrol-d);flex:0 0 auto}.compact-welcome strong{font-size:15px}.compact-welcome p{margin:3px 0 0;color:var(--ink2);font-size:13px}.compact-invites{grid-column:1/-1;margin:2px 0 0;grid-template-columns:repeat(3,1fr)}.compact-invites .invite{min-height:58px;padding:8px 10px;border:1px solid #C6CDDC;border-radius:13px;background:#FBFDFC;color:var(--petrol-d);justify-content:center;box-shadow:none}.compact-invites .invite .ico{background:transparent;color:var(--petrol);width:auto;height:auto}

.ai-prev{margin-top:10px;padding:12px;border-radius:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.ai-prev b{display:block;margin-bottom:6px}
.ai-prev div{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
#mailStatus .suggest a{color:inherit;font-weight:700}
@media (prefers-reduced-motion:reduce){.btn.rec-on .rec-dot{animation:none}}
/* ---------- barve za rdeča besedila + temna tema (mora ostati na koncu) ---------- */
:root{--danger-ink:#8E2C10;--on-accent:#fff}
.cal-inline{padding:14px}
.cal-inline .cal-nav{margin-top:0}
[data-theme="dark"]{
  color-scheme:dark;
  --mist:#111113; --paper:#1C1E21; --ink:#E8EBF2; --ink2:#A9B2C4; --line:#2A3347;
  --petrol:#4F76C9; --petrol-d:#91ACE5; --petrol-t:#172440;
  --gold:#F2B93F; --gold-t:#3D3216; --coral:#F27B58; --coral-t:#43241C;
  --moss:#67C58A; --moss-t:#183A27;
  --blue:#2B3C60; --blue-hover:#354973; --blue-soft:#18233A; --blue-ink:#D2DDF4; --blue-placeholder:#7F8DAC;
  --danger-ink:#FFB4A0; --on-accent:#16181D;
}
[data-theme="dark"] html,html[data-theme="dark"]{background:var(--mist)}
[data-theme="dark"] body{background:linear-gradient(180deg,#151618 0%,#0F1012 100%);color:var(--ink)}
[data-theme="dark"] .icon-btn{background:var(--paper);border-color:var(--line);box-shadow:none}
[data-theme="dark"] .icon-btn:hover{background:var(--petrol-t);color:var(--petrol-d)}
/* gumbi */
[data-theme="dark"] .btn{background:var(--petrol);border-color:var(--petrol);color:var(--on-accent);box-shadow:none}
[data-theme="dark"] .btn:hover{background:#6F91DA;border-color:#6F91DA}
[data-theme="dark"] .btn.ghost{background:var(--paper);color:var(--petrol-d);border-color:#35466B}
[data-theme="dark"] .btn.ghost:hover{background:var(--petrol-t);border-color:#4A5F8B}
[data-theme="dark"] .btn.plain,[data-theme="dark"] a.btn.plain{background:transparent;border-color:transparent;color:var(--petrol-d)}
[data-theme="dark"] .btn.plain:hover{background:var(--petrol-t)}
[data-theme="dark"] .btn.rec-on{background:var(--coral-t);color:var(--ink);border-color:var(--coral)}
[data-theme="dark"] .alert .btn{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
[data-theme="dark"] .alert .btn:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
[data-theme="dark"] .alert .btn.plain{background:var(--blue-soft);border:1.5px solid var(--blue);color:var(--blue-ink)}
[data-theme="dark"] .ai-box .btn.ghost{background:var(--paper)}
[data-theme="dark"] .danger{color:var(--danger-ink)!important;border-color:#35466B!important;box-shadow:none}
[data-theme="dark"] .danger:hover{background:var(--coral-t)!important;color:var(--danger-ink)!important}
[data-theme="dark"] .fab{background:var(--petrol);color:var(--on-accent);box-shadow:0 8px 24px rgba(0,0,0,.45)}
[data-theme="dark"] .fab:hover{background:#6F91DA}
/* polja */
[data-theme="dark"] input[type=time],
[data-theme="dark"] input[type=date],
[data-theme="dark"] input[type=datetime-local],
[data-theme="dark"] input[type=number],
[data-theme="dark"] input[type=text],
[data-theme="dark"] input[type=password],
[data-theme="dark"] input[type=search],
[data-theme="dark"] select,
[data-theme="dark"] textarea,
[data-theme="dark"] .qa textarea,
[data-theme="dark"] .qa input,
[data-theme="dark"] .quick input,
[data-theme="dark"] .quick select{background:#161719;color:var(--ink);border-color:#313A4F}
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus,[data-theme="dark"] textarea:focus{border-color:var(--petrol);box-shadow:0 0 0 3px rgba(79,185,201,.22)}
[data-theme="dark"] ::placeholder{color:var(--blue-placeholder)}
[data-theme="dark"] input[type=date],[data-theme="dark"] input[type=time],[data-theme="dark"] input[type=datetime-local]{color-scheme:dark}
[data-theme="dark"] .qa,[data-theme="dark"] .quick{background:var(--paper);border-color:var(--line)}
/* nav, kartice, plan */
[data-theme="dark"] nav{background:rgba(19,34,42,.96);border-top-color:var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
[data-theme="dark"] nav button{color:var(--ink2)}
[data-theme="dark"] nav button[aria-current=page]{background:var(--petrol-t);color:var(--petrol-d)}
[data-theme="dark"] .day-actions{background:var(--paper);box-shadow:none}
[data-theme="dark"] .day-plan-card,[data-theme="dark"] .dash-section,[data-theme="dark"] .inbox-card,[data-theme="dark"] .dash-clear,[data-theme="dark"] .note-card{box-shadow:none}
[data-theme="dark"] .day-plan-card .advice{background:var(--gold-t);color:#F5DC9A;border-color:#5C4B1F}
[data-theme="dark"] .flow li::before{background:var(--line)}
[data-theme="dark"] .blk{background:transparent}
[data-theme="dark"] .blk:hover{background:var(--petrol-t);border-color:#2C3C60}
[data-theme="dark"] .tip-rekreacija{--ct:#A6E5BD}
[data-theme="dark"] .tip-opomnik{--ct:#FFB4A0}
[data-theme="dark"] .row:hover{background:rgba(255,255,255,.03)}
[data-theme="dark"] .seg{border-color:#35466B}
[data-theme="dark"] .seg button[aria-pressed=true]{background:var(--petrol);color:var(--on-accent);box-shadow:none}
[data-theme="dark"] .chip[aria-pressed=true]{background:var(--petrol);border-color:var(--petrol);color:var(--on-accent)}
[data-theme="dark"] .src{background:var(--blue-soft);border-color:#35466B;color:var(--petrol-d)}
[data-theme="dark"] .src:hover,[data-theme="dark"] .src.on{background:var(--petrol-t)}
[data-theme="dark"] .compact-invites .invite{background:var(--blue-soft);border-color:#35466B;color:var(--petrol-d)}
[data-theme="dark"] .invite:hover{background:var(--petrol-t)}
[data-theme="dark"] .chk[aria-pressed=true] .circle{color:var(--on-accent)}
[data-theme="dark"] .work-day input:checked+span{color:var(--on-accent)}
[data-theme="dark"] .th button{background:var(--ink);color:var(--mist)}
[data-theme="dark"] .cal-cell.sel{background:var(--petrol);border-color:var(--petrol);color:var(--on-accent)}
[data-theme="dark"] .cal-cell.sel .cal-dots b{background:var(--on-accent)}
[data-theme="dark"] .cal-cell.other{opacity:.45}
/* značke in besedila */
[data-theme="dark"] .badge{color:#A6E5BD}
[data-theme="dark"] .badge.warn{color:#F5DC9A}
[data-theme="dark"] .badge.bad{color:var(--danger-ink)}
[data-theme="dark"] .badge.plain{background:#242D40;color:var(--ink2)}
[data-theme="dark"] .sync-status.ok{color:#6FD39A}
[data-theme="dark"] .sync-status.busy{color:#F2B93F}
[data-theme="dark"] .sync-status.err{color:#FF8E7A}
[data-theme="dark"] .rv-edit>summary{color:var(--petrol-d)}
[data-theme="dark"] #toast{background:#26314A;color:#E8EBF2;border:1px solid #35466B;box-shadow:0 10px 26px rgba(0,0,0,.5)}
[data-theme="dark"] dialog#sheet{background:var(--paper);color:var(--ink)}
[data-theme="dark"] dialog#sheet::backdrop{background:rgba(0,0,0,.6)}
[data-theme="dark"] .inbox-dash{background:linear-gradient(180deg,var(--paper),var(--blue-soft))}
[data-theme="dark"] audio{color-scheme:dark}
/* ---------- agent ---------- */
.agent-entry{display:flex;align-items:center;gap:12px;padding:14px;margin:0 0 14px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
.agent-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;background:var(--petrol-t);color:var(--petrol-d)}
.agent-entry-main{flex:1;min-width:0}.agent-entry-main strong{display:block;font-size:15px}.agent-entry-main small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35}
.agent-entry-btns{display:flex;gap:8px;flex:0 0 auto}
@media(max-width:520px){.agent-entry{flex-wrap:wrap}.agent-entry-main{flex:1 1 calc(100% - 60px)}.agent-entry-btns{width:100%}.agent-entry-btns .btn{flex:1}}
.ag-log{display:grid;gap:10px;margin:10px 0}
.ag-msg{max-width:92%;padding:10px 14px;border-radius:16px;line-height:1.42;overflow-wrap:anywhere}
.ag-msg.user{justify-self:end;background:var(--petrol);color:var(--on-accent);border-bottom-right-radius:6px}
.ag-msg.ai{justify-self:start;background:var(--petrol-t);color:var(--ink);border-bottom-left-radius:6px}
.ag-actions{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:12px 14px}
.ag-h{display:block;font:800 15px var(--font-h);margin-bottom:4px}
.ag-list{list-style:none;margin:0;padding:0}
.ag-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.ag-item:first-child{border-top:0}
.ag-item input{width:22px;height:22px;min-height:0;accent-color:var(--petrol);flex:0 0 auto;margin:2px 0 0}
.ag-item .rv-b{display:flex;flex-direction:column;min-width:0;gap:1px}
.ag-item small{color:var(--ink2);font-size:13.5px}
.ag-st{width:22px;height:22px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;margin-top:1px}
.ag-item.narejeno .ag-st{background:var(--moss-t);color:var(--moss)}
.ag-item.napaka .ag-st,.ag-item.zavrzeno .ag-st{background:var(--coral-t);color:var(--danger-ink)}
.ag-item.zavrzeno{opacity:.6}
.ag-note.narejeno{color:var(--moss)!important}.ag-note.napaka{color:var(--danger-ink)!important}
.ag-body{margin:6px 0 0;padding:8px 10px;border-radius:10px;background:var(--blue-soft);white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;max-height:170px;overflow:auto}
.ag-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.ag-input{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end;margin-top:8px}
.ag-input textarea{min-height:52px;resize:none}
.ag-input .quick-mic{width:48px;height:48px;border-radius:13px}
.ag-input .btn{min-height:48px}
@media(max-width:420px){.ag-input{grid-template-columns:1fr auto}.ag-input .btn{grid-column:1/-1}}

/* ---------- v14: Danes = agent + načrt, nastavitve v podoknih ---------- */
body[data-tab=today] .fab{display:none}
.agent-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 22px rgba(24,57,55,.05);padding:16px;margin:0 0 18px}
.agent-head{display:flex;align-items:center;gap:12px}
.agent-head .grow{flex:1;min-width:0}
.agent-head strong{display:block;font:800 20px var(--font-h);letter-spacing:-.02em}
.agent-head small{display:block;color:var(--ink2);font-size:12.5px}
.conn-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--gold-t);font-size:13.5px}
.conn-banner .btn{flex:0 0 auto}
.agent-card .ag-log{margin:12px 0 0}
.agent-card .ag-chips{margin:10px 0 4px}
.set-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}
.set-tab{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:700 14px var(--font-b);color:var(--ink2);cursor:pointer}
.set-tab[aria-selected=true]{background:var(--petrol);border-color:var(--petrol);color:#fff}
[data-theme="dark"] .set-tab[aria-selected=true]{color:var(--on-accent)}
.set-panel .rvh:first-child{margin-top:4px}
.set-panel textarea{min-height:84px}
.blk .edit-hint{margin-left:10px}

.wx-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 22px rgba(24,57,55,.05);padding:16px;margin:0 0 18px}
.wx-head{display:flex;align-items:center;gap:12px}
.wx-big{font-size:34px;line-height:1}
.wx-temp{font-size:30px;font-weight:800;line-height:1;color:var(--petrol)}
.wx-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;font-size:13.5px;color:var(--ink2)}
.wx-hours{display:flex;gap:6px;margin:12px 0 0;overflow-x:auto}
.wx-hours>div{flex:1 0 54px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.wx-hours small{font-size:11.5px;color:var(--ink2)}
.wx-hours.three{overflow:visible}
.wx-hours.three>div{flex:1 1 0;min-width:0}
.wx-sport{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:14px}
.wx-sport.good{background:var(--moss-t)}.wx-sport.bad{background:var(--gold-t)}
.gm-adv{margin:4px 0 12px;font-size:14px}.gm-adv summary{cursor:pointer;font-weight:700;color:var(--ink2)}

textarea.ag-body{display:block;width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:inherit;resize:vertical;margin-top:6px}
.ag-why{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.ag-why .chip{font:inherit;font-size:.78rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:inherit;cursor:pointer}
.ag-src{font-size:.8rem;margin:2px 0 8px;opacity:.85;overflow-wrap:anywhere}
.rules{list-style:none;margin:6px 0;padding:0}
.rule{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.rule label{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:0}
.rule-add{display:flex;gap:8px}
.rule-add input{flex:1;min-width:0}
/* ---------- PC: okna v sredini zaslona ---------- */
@media(min-width:768px){
  dialog#sheet{margin:auto;max-width:640px;max-height:86vh;max-height:86dvh;border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  dialog#sheet[open]{animation:pop .18s ease-out}
  .sheet-in{padding:24px 28px 28px}
  #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
@keyframes pop{from{transform:scale(.97) translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ===== enotna lestvica: razmiki, zaobljenost, sence ===== */
:root{--r-sm:14px;--r-md:16px;--r-lg:20px;--sp-1:6px;--sp-2:10px;--sp-3:16px;--sp-4:24px;
  --sh-1:0 1px 2px rgba(15,37,48,.06),0 6px 18px rgba(15,37,48,.06);--sh-2:0 10px 30px rgba(15,37,48,.14)}
[data-theme="dark"]{--sh-1:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.28);--sh-2:0 12px 32px rgba(0,0,0,.55)}
.agent-card,.wx-card,.day-plan-card,.dash-clear{border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:var(--sp-3);margin:0 0 var(--sp-3)}
.dash-section{margin:0 0 var(--sp-3)}
.inbox-mini,.wx-hours>div,.advice,.wx-sport,.btn,.blk{border-radius:var(--r-sm)}
h2.sec{margin:var(--sp-4) 0 var(--sp-2)}
.btn,.chip,.icon-btn{transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.chip{min-height:40px}
.sheet-in{border-radius:var(--r-lg) var(--r-lg) 0 0}
/* mehek prehod ob zamenjavi zavihka */
#view.tab-in{animation:tabIn .22s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* temni način: kontrast */
[data-theme="dark"] .wx-hours.three>div small:last-child{color:#8BA7E4}
[data-theme="dark"] .live-bar{background:rgba(255,255,255,.18)}
[data-theme="dark"] .flow li.is-live .blk{background:var(--gold-t);color:var(--ink)}
[data-theme="dark"] .row::before{opacity:.9}
[data-theme="dark"] .row.prio-nizka::before{background:#2C3C60}
/* telefon */
@media (max-width:400px){#app{padding-left:12px;padding-right:12px}.top h1{font-size:26px}.wx-hours.three>div span{font-size:26px}}
@media (prefers-reduced-motion:reduce){#view.tab-in{animation:none}}

/* ===== dodatki: ura »zdaj«, pretekli bloki, vreme, fade, telefon ===== */
.flow li.now::after{left:67px;top:16px;height:2px;opacity:.7}
.flow li.is-past:not(.is-done) time,.flow li.is-past:not(.is-done) .node{opacity:.5}
.flow li.is-live time{color:var(--ink)}
.flow li.is-live .node{background:var(--gold);box-shadow:0 0 0 4px var(--paper)}
.flow li.is-live .blk .k{font-weight:700}
.row.overdue .grow small:first-of-type{color:var(--danger-ink)}
.row.completing{opacity:.5;transition:opacity .25s ease,transform .25s ease;transform:translateX(3px)}
.row.completing .grow strong,.dash-row.completing strong{text-decoration:line-through;color:var(--ink2)}
.dash-row.completing{opacity:.5;transition:opacity .25s ease}
.circle{transition:background .2s ease,border-color .2s ease}
.chk[aria-pressed=true] .circle{animation:chkPop .22s ease}
@keyframes chkPop{50%{transform:scale(1.15)}}
.wx-card{transition:background .4s ease}
.wx-card.wx-sun{background:linear-gradient(135deg,#FFF3D0 0%,var(--paper) 72%)}
.wx-card.wx-cloud{background:linear-gradient(135deg,#E4E7EE 0%,var(--paper) 72%)}
.wx-card.wx-rain{background:linear-gradient(135deg,#D6DFF3 0%,var(--paper) 72%)}
.wx-card.wx-snow{background:linear-gradient(135deg,#EFF0F2 0%,var(--paper) 72%)}
.wx-card.wx-storm{background:linear-gradient(135deg,#D9DBEC 0%,var(--paper) 72%)}
.wx-card.wx-night{background:linear-gradient(135deg,#DDE3F1 0%,var(--paper) 72%)}
[data-theme="dark"] .wx-card.wx-sun{background:linear-gradient(135deg,#3B3215 0%,var(--paper) 78%)}
[data-theme="dark"] .wx-card.wx-cloud{background:linear-gradient(135deg,#242D42 0%,var(--paper) 78%)}
[data-theme="dark"] .wx-card.wx-rain{background:linear-gradient(135deg,#17274A 0%,var(--paper) 78%)}
[data-theme="dark"] .wx-card.wx-snow{background:linear-gradient(135deg,#24304A 0%,var(--paper) 78%)}
[data-theme="dark"] .wx-card.wx-storm{background:linear-gradient(135deg,#2B2745 0%,var(--paper) 78%)}
[data-theme="dark"] .wx-card.wx-night{background:linear-gradient(135deg,#17213B 0%,var(--paper) 78%)}
.wx-hours>div{background:rgba(255,255,255,.62)}
[data-theme="dark"] .wx-hours>div{background:rgba(255,255,255,.05)}
.wx-hours .rain{display:block;width:62%;height:4px;border-radius:2px;background:rgba(42,111,176,.2);overflow:hidden;margin:2px 0}
.wx-hours .rain i{display:block;height:100%;border-radius:2px;background:#2A54B0}
[data-theme="dark"] .wx-hours .rain{background:rgba(127,196,240,.22)}
[data-theme="dark"] .wx-hours .rain i{background:#8BA7E4}
@media (max-width:700px),(pointer:coarse){
  .chk,.mini{width:46px;height:46px}
  .row{min-height:62px}
  .row-menu{gap:8px;padding:2px 0 8px}
  .row-menu .btn.sm{min-height:46px}
  .chip,.set-tab{min-height:44px}
  .seg button{min-height:44px}
  nav button{min-height:62px}
  .cal-cell{min-height:48px}
}
@media (prefers-reduced-motion:reduce){.row.completing,.dash-row.completing,.chk[aria-pressed=true] .circle,.wx-card{animation:none;transition:none}}

.day-actions-btns,.quick,.rule-add,.agent-entry,.gcal-row,.cal-ev,.cal-action{min-width:0;max-width:100%}

  .top{align-items:flex-start;gap:8px}

  .top-a .btn{padding-left:10px;padding-right:10px}

class UserErr extends Error {}
function apiErrText(status, data) {
  const m = (data && data.error && data.error.message) || '';
  if (status === 400 && /API key/i.test(m)) return 'Ključ API ni veljaven. Preveri ga v nastavitvah.';
  if (status === 400) return 'Gemini je zavrnil zahtevo: ' + m;
  if (status === 401 || status === 403) return `Ključ nima dostopa do tega modela (${status}). Preveri ključ in omejitve v Google AI Studio.`;
  if (status === 404) return 'Model ni najden. V nastavitvah preveri ime modela.';
  if (status === 429) return 'Dosežena omejitev zahtev. Počakaj minuto in poskusi znova.';
  if (status >= 500) return 'Gemini je trenutno preobremenjen. Poskusi znova čez nekaj trenutkov.';
  return `Napaka ${status}: ${m}`;
}
function parseJson(t) {
  t = (t || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch (e) { /* fallthrough */ }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* fallthrough */ } }
  throw new UserErr('Odgovora modela nisem mogel razbrati. Poskusi znova.');
}

async function genPost(model, key, body, signal) {
  const post = m => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify(body),
    signal
  });
  let res = await post(model);
  if (res.status === 404 && !/preview$/.test(model)) {
    const r2 = await post(model + '-preview');
    if (r2.ok) { S.settings.model = model + '-preview'; save(); res = r2; }
  }
  return res;
}
async function callGemini(parts, extra = '') {
  const key = (S.settings.apiKey || '').trim();
  if (!key) throw new UserErr('NO_KEY');
  const model = (S.settings.model || 'gemini-3.1-flash-lite').trim();
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT + '\n\n' + FORMAT_RULES + (userContext() ? '\n\n' + userContext() : '') + (extra ? '\n\n' + extra : '') }] },
    contents: [{ role: 'user', parts }],
    generationConfig: { responseMimeType: 'application/json' }
  };
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 90000);
  try {
    const res = await genPost(model, key, body, ctrl.signal);
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new UserErr(apiErrText(res.status, data));
    const cand = data && data.candidates && data.candidates[0];
    if (!cand) {
      const br = data && data.promptFeedback && data.promptFeedback.blockReason;
      throw new UserErr(br ? `Gemini je vnos blokiral (${br}).` : 'Model ni vrnil odgovora. Poskusi znova.');
    }
    const txt = arr(cand.content && cand.content.parts).filter(p => p.text && !p.thought).map(p => p.text).join('');
    return parseJson(txt);
  } catch (e) {
    if (e instanceof UserErr) throw e;

function icsEscape(v) { return String(v || '').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,'); }

  if (!date && !time) { toast('Za koledar manjka datum ali ura.'); return; }
  const eventDate = date || today();
  const uidv = `${uid()}@lifeflow`;
  const now = icsStamp();
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LifeFlow AI//Life Organizer//SL','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:LifeFlow AI','BEGIN:VEVENT',

    if (!Number.isFinite(d.getTime())) { toast('Datuma ali ure ni mogoče uporabiti za koledar.'); return; }
    const start = d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
    const end = new Date(d.getTime() + 60*60*1000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
    lines.push(`DTSTART:${start}`,`DTEND:${end}`);
  } else {
    lines.push(`DTSTART;VALUE=DATE:${ymdToIcsDate(eventDate)}`,`DTEND;VALUE=DATE:${ymdToIcsDate(addDays(eventDate,1))}`);
  }
  lines.push(`SUMMARY:${icsEscape(title)}`,`DESCRIPTION:${icsEscape(note)}`);
  lines.push('BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(title)}`,'END:VALARM');

/* Kronološki seznam blokov z oznako »zdaj«.
   Pravilo: oznaka stoji takoj za zadnjim blokom, ki se je že začel (start <= zdaj),
   in pred prvim blokom, ki se šele začne (start > zdaj). Blok, ki trenutno poteka, je torej
   nad oznako in je posebej poudarjen. */
function planFlowItems(p) {
  const d = new Date(), nowM = d.getHours() * 60 + d.getMinutes();
  const nowLi = `<li class="now"><time>${pad(d.getHours())}:${pad(d.getMinutes())}</time><i class="node"></i><span class="pill">zdaj</span></li>`;
  const safeM = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : 0; };
  const sorted = p.bloki.map((b, originalIndex) => ({ b, originalIndex, st: safeM(b.od), en: safeM(b.do) }))
    .sort((x, y) => x.st - y.st || x.en - y.en || x.originalIndex - y.originalIndex);
  let marked = false, items = '';
  sorted.forEach(({ b, originalIndex, st, en }) => {
    if (!marked && st > nowM) { marked = true; items += nowLi; }
    const live = st <= nowM && nowM < en && !b.done;
    const pct = live ? Math.round((nowM - st) / Math.max(1, en - st) * 100) : 0;
    const past = !live && en <= nowM;
    items += `<li class="tip-${esc(b.tip)}${b.done ? ' is-done' : ''}${live ? ' is-live' : ''}${past && !b.done ? ' is-past' : ''}"><time>${esc(b.od)}<small>${esc(b.do)}</small></time><i class="node"></i>
      <button class="blk" data-act="blk" data-i="${originalIndex}" aria-label="Uredi dogodek: ${esc(b.naslov)}"><span class="t">${esc(b.naslov)}</span><span class="k">${TIP[b.tip] || ''}${b.done ? ' · opravljeno' : live ? ' · še ' + (en - nowM) + ' min' : ''}</span>${live ? `<span class="live-bar" aria-hidden="true"><i style="width:${pct}%"></i></span>` : ''}<span class="edit-hint">Uredi</span></button></li>`;
  });
  if (!marked) items += nowLi;
  return items;
}

  };

}

    <div class="ai-box"><div class="ai-h">${ic('spark',18)}<strong>AI pomočnik</strong></div>
      <div class="field" style="margin:0"><input id="noteAiInstr" type="text" maxlength="300" autocomplete="off" aria-label="Navodilo za AI" placeholder="Navodilo (neobvezno): npr. krajše, bolj uradno …" value="${esc(noteForm.instr || '')}"></div>

async function deleteNote(id) {
  const note = S.notes.find(n => n.id === id); if (!note) return;
  if (!confirm('Izbrišem ta zapisek? Tega dejanja ni mogoče razveljaviti.')) return;
  for (const img of (note.images || [])) { await idb.del(img).catch(() => {}); imgUrls.delete(img); }
  for (const a of (note.audio || [])) { await idb.del(a.id).catch(() => {}); imgUrls.delete(a.id); }
  S.notes = S.notes.filter(n => n.id !== id); noteForm = null; noteMail = null; save(); if (sheet.open && sheet.dataset.kind === 'note') sheet.close(); render(); toast('Zapisek je izbrisan.');
}
async function saveNote() {
  if (!noteForm) return;
  if (noteRec.on) { toast('Najprej ustavi snemanje.'); return; }
  syncNoteDom();
  noteForm.title = noteForm.title.trim(); noteForm.text = noteForm.text.trim();
  const keepAud = noteForm.existingAudio.filter(a => !noteForm.removeAudio.includes(a.id));
  const hasImg = noteForm.images.length || noteForm.existingImages.some(id => !noteForm.removeImages.includes(id));
  if (!noteForm.title && !noteForm.text && !hasImg && !keepAud.length && !noteForm.audio.length) { toast('Najprej vpiši naslov, besedilo ali dodaj sliko ali posnetek.'); return; }
  const old = noteForm.id ? S.notes.find(n => n.id === noteForm.id) : null;
  const imageIds = noteForm.existingImages.filter(id => !noteForm.removeImages.includes(id));
  const audioMeta = keepAud.map(a => ({ id: a.id, dur: a.dur }));
  try {
    for (const im of noteForm.images) {
      const id = 'note-' + uid();
      const blob = await (await fetch(im.url)).blob();
      await idb.put(id, blob); imageIds.push(id);
    }
    for (const a of noteForm.audio) {
      const id = 'noteaud-' + uid();
      await idb.put(id, a.blob); audioMeta.push({ id, dur: a.dur });
    }
    for (const id of noteForm.removeImages) { await idb.del(id).catch(() => {}); imgUrls.delete(id); }
    for (const id of noteForm.removeAudio) { await idb.del(id).catch(() => {}); imgUrls.delete(id); }
  } catch (e) { toast('Slike ali posnetka ni bilo mogoče shraniti. Preveri prostor v brskalniku.'); return; }
  noteForm.audio.forEach(a => { try { URL.revokeObjectURL(a.url); } catch (e) {} });
  const note = { id: old ? old.id : uid(), title: noteForm.title || 'Brez naslova', text: noteForm.text, images: imageIds, audio: audioMeta, createdAt: old?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
  if (old) S.notes = S.notes.map(n => n.id === old.id ? note : n); else S.notes.push(note);
  noteForm = null; noteMail = null; save(); sheet.close(); render(); toast('Zapisek je shranjen.');
}

/* ----- snemanje zvoka ----- */
function renderNoteRec() {
  const b = $('#btnNoteRec'), info = $('#noteRecInfo'); if (!b) return;
  b.classList.toggle('rec-on', noteRec.on);
  b.innerHTML = noteRec.on ? `<span class="rec-dot"></span> Ustavi ${fmtSecs(noteRec.secs)}` : `${ic('mic',17)} Snemaj zvok`;
  if (info) info.textContent = noteRec.on ? 'Snemam … tapni Ustavi, ko končaš.' : 'Posnetek se shrani v zapisek, AI ga po želji pretipka v besedilo.';
}
function hydrateAudio(root = document) {
  const missing = el => { const p = document.createElement('p'); p.className = 'help'; p.textContent = 'Posnetek ni na voljo na tej napravi.'; el.replaceWith(p); };
  root.querySelectorAll('audio[data-aud]:not([src])').forEach(async el => {
    try { const u = await imgUrl(el.dataset.aud); if (u) el.src = u; else missing(el); } catch (e) { missing(el); }
  });
}
function renderNoteAudio() {
  const el = $('#noteAudList'); if (!el || !noteForm) return;
  el.innerHTML = noteAudioItems().map(it => `<div class="aud-item"><audio controls preload="metadata" ${it.src === 'new' ? `src="${it.url}"` : `data-aud="${esc(it.id)}"`}></audio><div class="aud-row"><span>${ic('mic',14)} ${fmtSecs(it.dur || 0)}${it.src === 'new' ? ' · še ni shranjeno' : ''}</span><button type="button" class="btn sm plain" data-act="noteTr" data-key="${esc(it.key)}" ${noteAi.busy ? 'disabled' : ''}>${noteAi.busy === 'tr:' + it.key ? '<span class="spin"></span> Pretipkavam …' : ic('spark',14) + ' Pretipkaj z AI'}</button><button type="button" class="btn sm plain" data-act="noteAudRm" data-key="${esc(it.key)}">Odstrani</button></div></div>`).join('');
  hydrateAudio(el);
}
async function noteRecToggle() {
  if (!noteForm) return;
  if (noteRec.on) { if (noteRec.mr && noteRec.mr.state !== 'inactive') noteRec.mr.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Ta brskalnik ne podpira snemanja zvoka.'); return; }
  if (noteAudioItems().length >= NOTE_AUD_MAX) { toast(`Največ ${NOTE_AUD_MAX} posnetkov na zapisek.`); return; }
  if (quickRecognition) { try { quickRecognition.stop(); } catch (e) {} }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [], mr = new MediaRecorder(stream);
    Object.assign(noteRec, { on: true, t0: Date.now(), secs: 0, mr, stream, discard: false });
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(noteRec.timer); stream.getTracks().forEach(t => t.stop());
      const dur = Math.max(1, Math.round((Date.now() - noteRec.t0) / 1000));
      const discard = noteRec.discard;
      noteRec.on = false; noteRec.mr = null; noteRec.stream = null;
      if (!discard && noteForm && chunks.length) {
        const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        noteForm.audio.push({ blob, url: URL.createObjectURL(blob), dur });
        toast('Posnetek je dodan. Shrani zapisek, da ga obdržiš.');
      }
      renderNoteRec(); renderNoteAudio();
    };
    mr.start();
    noteRec.timer = setInterval(() => {
      noteRec.secs = Math.round((Date.now() - noteRec.t0) / 1000); renderNoteRec();
      if (noteRec.secs >= NOTE_REC_MAX && mr.state !== 'inactive') mr.stop();
    }, 500);
    renderNoteRec();
  } catch (e) {
    noteRec.on = false; renderNoteRec();
    toast('Dostop do mikrofona ni dovoljen. Dovoli ga v nastavitvah brskalnika.');
  }
}
function noteAudRemove(key) {
  if (!noteForm) return;
  if (key.startsWith('o:')) { const id = key.slice(2); if (!noteForm.removeAudio.includes(id)) noteForm.removeAudio.push(id); }
  else { const i = +key.slice(2), a = noteForm.audio[i]; if (a) { try { URL.revokeObjectURL(a.url); } catch (e) {} noteForm.audio.splice(i, 1); } }
  renderNoteAudio();
}

/* ----- AI: stanje in izpis ----- */
function renderNoteAi() {
  sheet.querySelectorAll('[data-ai]').forEach(b => { b.disabled = !!noteAi.busy; });
  const el = $('#noteAiStatus'); if (!el) return;
  let h = '';
  if (noteAi.busy) {
    const t = noteAi.busy === 'improve' ? 'Izboljšujem zapis …' : noteAi.busy === 'tasks' ? 'Iščem opravila in dogodke …' : 'Pretipkavam posnetek …';
    h += `<p class="busy"><span class="spin"></span> ${t}</p>`;
  }
  if (noteAi.err) h += `<p class="err" role="alert">${esc(noteAi.err)}</p>`;
  if (noteAi.info) h += `<p class="help">${esc(noteAi.info)}</p>`;
  if (noteAi.improved) {
    const im = noteAi.improved;
    h += `<div class="ai-prev"><b>${esc(im.title || 'Predlog AI')}</b><div>${esc(im.text)}</div></div>${im.info ? `<p class="help">${esc(im.info)}</p>` : ''}<div class="set-actions"><button type="button" class="btn sm" data-act="noteAiUse">${ic('check',15)} Uporabi</button><button type="button" class="btn sm plain" data-act="noteAiDiscard">Zavrži</button></div>`;
  }
  if (noteAi.undo && !noteAi.improved) h += `<div class="set-actions"><button type="button" class="btn sm plain" data-act="noteAiUndo">Razveljavi izboljšavo</button></div>`;
  el.innerHTML = h;

}
function noteAiGuard() {
  if (!noteForm || noteAi.busy) return false;
  syncNoteDom();
  noteAi.err = ''; noteAi.info = '';
  if (!noteHasKey()) { noteAi.err = 'Manjka Gemini API ključ. Vnesi ga v Nastavitvah (zobnik zgoraj desno).'; renderNoteAi(); return false; }
  return true;
}

/* ----- AI: izboljšaj zapis ----- */
async function noteAiImprove() {
  if (!noteForm || noteAi.busy) return;
  syncNoteDom();
  if (!noteForm.text.trim()) { toast('Najprej napiši ali narekuj zapisek.'); return; }
  if (!noteAiGuard()) return;
  const form = noteForm; noteAi.busy = 'improve'; noteAi.improved = null; renderNoteAi();
  try {
    const parts = [{ text: 'ZAPISEK UPORABNIKA:\n' + noteSource() }];
    if (form.instr.trim()) parts.push({ text: 'NAVODILO UPORABNIKA: ' + form.instr.trim() });
    const r = await callGemini(parts, NOTE_PROMPTS.improve);
    if (noteForm !== form) return;
    const text = String(r && r.besedilo || '').trim();
    if (!text) throw new UserErr('AI ni vrnil besedila. Poskusi znova.');
    noteAi.improved = { title: String(r.naslov || form.title || '').trim().slice(0, 120), text, info: str(r.povzetek) || '' };
  } catch (e) { if (noteForm === form) noteAi.err = e.message || 'AI ni uspel izboljšati zapisa.'; }
  if (noteForm === form) { noteAi.busy = ''; renderNoteAi(); }
}
function noteAiUse() {
  if (!noteForm || !noteAi.improved) return;
  syncNoteDom();
  noteAi.undo = { title: noteForm.title, text: noteForm.text };
  if (noteAi.improved.title) noteForm.title = noteAi.improved.title;
  noteForm.text = noteAi.improved.text;
  noteAi.improved = null;
  const t = $('#noteTitle'), x = $('#noteText'); if (t) t.value = noteForm.title; if (x) x.value = noteForm.text;
  renderNoteAi(); toast('Zapisek je posodobljen. Shrani ga, ko si zadovoljen.');
}
function noteAiUndo() {
  if (!noteForm || !noteAi.undo) return;
  noteForm.title = noteAi.undo.title; noteForm.text = noteAi.undo.text; noteAi.undo = null;
  const t = $('#noteTitle'), x = $('#noteText'); if (t) t.value = noteForm.title; if (x) x.value = noteForm.text;
  renderNoteAi();
}

/* ----- AI: pretipkaj posnetek ----- */
async function noteTranscribe(key) {
  if (!noteForm || noteAi.busy) return;
  const it = noteAudioItems().find(x => x.key === key); if (!it) return;
  if (!noteAiGuard()) return;
  const form = noteForm; noteAi.busy = 'tr:' + key; renderNoteAi();
  try {
    const blob = it.src === 'new' ? it.blob : await idb.get(it.id);
    if (!blob) throw new UserErr('Posnetka ni na tej napravi.');
    let wav;
    try { wav = await blobToWav(blob); } catch (e) { throw new UserErr('Posnetka ni bilo mogoče obdelati.'); }
    const r = await callGemini([{ inlineData: { mimeType: 'audio/wav', data: wav.b64 } }, { text: 'Pretipkaj ta posnetek.' }], NOTE_PROMPTS.transcribe);
    if (noteForm !== form) return;
    const t = String(r && r.besedilo || '').trim();
    if (!t) throw new UserErr('V posnetku nisem zaznal govora.');
    syncNoteDom();
    noteForm.text = (noteForm.text.trim() ? noteForm.text.replace(/\s+$/, '') + '\n\n' : '') + t;
    const x = $('#noteText'); if (x) x.value = noteForm.text;
    toast('Posnetek je pretipkan v zapisek.');
  } catch (e) { if (noteForm === form) noteAi.err = e.message || 'Pretipkavanje ni uspelo.'; }
  if (noteForm === form) { noteAi.busy = ''; renderNoteAi(); }
}

/* ----- AI: opravilo / dogodek iz zapiska ----- */
async function noteAiTasks() {
  if (!noteForm || noteAi.busy) return;
  syncNoteDom();
  if (!noteForm.text.trim() && !noteForm.title.trim()) { toast('Zapisek je prazen.'); return; }
  if (cap.busy) { toast('AI še obdeluje drug vnos. Poskusi čez trenutek.'); return; }
  if (!noteAiGuard()) return;
  const form = noteForm; noteAi.busy = 'tasks'; renderNoteAi();
  try {
    const instr = form.instr.trim() ? '\nNavodilo uporabnika: ' + form.instr.trim() : '';
    const r = normalize(await callGemini([{ text: 'Zapisek uporabnika:\n' + noteSource() }, { text: analyzePrompt() }], NOTE_PROMPTS.tasks + instr));
    if (noteForm !== form) return;
    noteAi.busy = '';
    if (!countOn(r)) { noteAi.info = r.opazil || 'AI v zapisku ni našel konkretnih opravil ali dogodkov.'; renderNoteAi(); return; }
    resetCap(); cap.result = r; cap.fromNote = true;
    openSheet(null, 'cap'); renderResult();
  } catch (e) { if (noteForm === form) { noteAi.busy = ''; noteAi.err = e.message || 'AI ni uspel prebrati zapiska.'; renderNoteAi(); } }
}

/* ----- e-pošta: osnutek z AI, Gmail osnutki in pošiljanje ----- */
function parseRecipients(s) { return String(s || '').split(/[,;\s]+/).map(x => x.trim()).filter(Boolean); }
function syncMailDom() {

/*

function captureRenderState() {
  const view = $('#view');
  if (!view) return null;

  const details = Array.from(view.querySelectorAll('details')).map((el, index) => ({
    index,
    open: !!el.open
  }));

  const active = document.activeElement;
  let focus = null;
  if (active && view.contains(active) &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) {
    const all = Array.from(view.querySelectorAll('input,textarea,select'));
    const index = all.indexOf(active);
    focus = {
      index,
      id: active.id || '',
      name: active.name || '',
      start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
      end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
      direction: active.selectionDirection || 'none'
    };
  }

  return {
    tab: S.ui.tab,
    scrollX: window.scrollX,
    scrollY: window.scrollY,
    details,
    focus
  };
}

function restoreRenderState(state) {
  if (!state) return;
  const view = $('#view');
  if (!view) return;

  Array.from(view.querySelectorAll('details')).forEach((el, index) => {
    const saved = state.details && state.details[index];
    if (saved) el.open = saved.open;
  });

  const f = state.focus;
  if (f) {
    let el = null;
    if (f.id) el = document.getElementById(f.id);
    if (!el && f.name) el = view.querySelector('[name="' + CSS.escape(f.name) + '"]');
    if (!el) el = view.querySelectorAll('input,textarea,select')[f.index];

    if (el) {
      try {
        el.focus({ preventScroll: true });
        if (f.start != null && typeof el.setSelectionRange === 'function') {
          const max = String(el.value ?? '').length;
          el.setSelectionRange(
            Math.min(f.start, max),
            Math.min(f.end ?? f.start, max),
            f.direction
          );
        }
      } catch (e) {
        try { el.focus(); } catch (e2) {}
      }
    }
  }

  window.scrollTo(state.scrollX || 0, state.scrollY || 0);
}

const FB_VER = '12.19.0';
const GCAL_SCOPE = ['https://www.googleapis.com/auth/calendar.events', 'https://www.googleapis.com/auth/calendar.calendarlist.readonly'];
const GTASK_SCOPE = 'https://www.googleapis.com/auth/tasks';
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.readonly';
const GMAIL_COMPOSE_SCOPE = 'https://www.googleapis.com/auth/gmail.compose'; // osnutki in pošiljanje e-pošte
const GTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Ljubljana'; } catch (e) { return 'Europe/Ljubljana'; } })();
const gcal = { fb: null, user: null, token: null, exp: 0, events: [], eventsTmr: [], calendars: [], loadedAt: 0, loading: false, err: null, busy: false };
const gtask = { lists: [], defaultListId: '@default', loadedAt: 0, syncing: false, err: null };
try { const t = JSON.parse(localStorage.getItem('lf.gtoken') || 'null'); if (t && t.exp > Date.now()) { gcal.token = t.token; gcal.exp = t.exp; } } catch (e) {}
const fbCfg = () => (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.authDomain && FIREBASE_CONFIG.projectId) ? FIREBASE_CONFIG : parseFbConfig(S.settings.fbConfig);
const gcalOn = () => !!(gcal.token && gcal.exp > Date.now());
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function parseFbConfig(txt) {
  txt = String(txt || '').trim(); if (!txt) return null;
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}'); if (a < 0 || b <= a) return null;
  const body = txt.slice(a, b + 1); let o = null;
  try { o = JSON.parse(body); } catch (e) {
    try { o = JSON.parse(body.replace(/(^|[\s,])\/\/[^\n\"]*$/gm, '$1').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}')); } catch (e2) { return null; }
  }

}
function fbErrMsg(e) {
  const c = e && e.code;
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return 'Prijava je bila prekinjena.';
  if (c === 'auth/unauthorized-domain') return 'Ta domena ni dovoljena. V Firebase dodaj domeno pod Authentication → Settings → Authorized domains.';
  if (c === 'auth/operation-not-allowed') return 'Google prijava ni vklopljena v Firebase (Authentication → Sign-in method).';
  if (c === 'auth/operation-not-supported-in-this-environment') return 'Prijava tu ni podprta. Aplikacija mora teči na https:// ali localhost.';
  return (e && e.message) || 'Prijava ni uspela.';
}
async function fbInit() {
  if (gcal.fb) return gcal.fb;
  const cfg = fbCfg();
  if (!cfg) throw new UserErr('Firebase podatki niso vpisani v datoteki index.html (FIREBASE_CONFIG).');
  let appM, M, FM;
  try {
    [appM, M, FM] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)
    ]);
  } catch (e) { throw new UserErr('Firebase se ni naložil. Preveri internetno povezavo.'); }

  const app = appM.getApps().length ? appM.getApp() : appM.initializeApp(cfg);
  const auth = M.getAuth(app);

  let db;
  try {
    db = FM.initializeFirestore(app, {
      localCache: FM.persistentLocalCache({ tabManager: FM.persistentMultipleTabManager() })
    });
  } catch (e) {
    // Če je Firestore že inicializiran ali brskalnik ne podpira želene persistence,
    // uporabimo obstoječo instanco.
    try { db = FM.getFirestore(app); } catch (e2) { throw new UserErr('Firestore se ni mogel inicializirati.'); }
  }

  gcal.fb = { auth, M, FM, db };
  M.onAuthStateChanged(auth, u => {
    gcal.user = u ? { name: u.displayName, email: u.email, photo: u.photoURL, uid: u.uid } : null;
    if (u) startCloudSync(u);
    else stopCloudSync();
    refreshGoogleUi();

  M.getRedirectResult(auth).then(r => { if (r) gotCred(r); }).catch(() => {});
  return gcal.fb;
}

/* ---------- Cloud sync (Google račun + Cloud Firestore) ----------
   Vsak Google uporabnik ima svojo zbirko:
   users/{uid}/app/state
   API ključa za Gemini in Firebase konfiguracije namenoma ne pošiljamo v cloud.
*/
const cloudSync = {
  uid: null,
  FM: null,
  db: null,
  unsub: null,
  timer: null,
  applyingRemote: false,
  ready: false,
  pending: false,
  lastJson: ''
};

function cloudState() {
  const x = JSON.parse(JSON.stringify(S));
  if (x.settings) {
    delete x.settings.apiKey;   // ostane samo na tej napravi
    delete x.settings.fbConfig; // konfiguracija je v kodi
  }
  // UI stanje je lokalno za posamezno napravo/brskalnik. Aktivni zavihek,
  // filtri, tema in časovni plan ne smejo prihajati iz druge naprave.
  delete x.ui;
  x.modelCache = null;           // začasni AI cache ni potreben na drugih napravah
  return x;
}

function cloudJson() {
  return JSON.stringify(cloudState());
}

function cloudStatus(text, type = '') {
  const el = document.querySelector('#syncStatus');
  if (!el) return;
  el.textContent = text;
  el.className = `sync-status ${type}`.trim();
}

function cloudPath() {
  return cloudSync.uid ? cloudSync.FM.doc(cloudSync.db, 'users', cloudSync.uid, 'app', 'state') : null;
}

function stableJson(o) {
  if (Array.isArray(o)) return '[' + o.map(stableJson).join(',') + ']';
  if (o && typeof o === 'object') return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + stableJson(o[k])).join(',') + '}';
  return JSON.stringify(o === undefined ? null : o);
}
function scheduleCloudSave() {
  if (!cloudSync.uid || !cloudSync.ready || cloudSync.applyingRemote) return;
  cloudSync.pending = true; cloudSync.dirty = true; cloudSync.dirtyAt = Date.now();
  clearTimeout(cloudSync.timer);
  cloudSync.timer = setTimeout(() => pushCloudState().catch(() => {}), 700);
}

async function pushCloudState() {
  if (!cloudSync.uid || !cloudSync.ready) return;
  const json = cloudJson();
  if (json === cloudSync.lastJson && !cloudSync.pending) return;
  cloudSync.pending = false;
  const sentStable = stableJson(JSON.parse(json));
  try {
    cloudStatus('Sinhronizacija …', 'busy');
    const ref = cloudPath();
    await cloudSync.FM.setDoc(ref, {
      state: JSON.parse(json),
      updatedAt: cloudSync.FM.serverTimestamp()
    }, { merge: false });
    cloudSync.lastJson = json;
    if (!cloudSync.pending && stableJson(cloudState()) === sentStable) cloudSync.dirty = false;
    cloudStatus('Sinhronizirano', 'ok');
  } catch (e) {
    cloudSync.pending = true;
    cloudStatus('Napaka pri sinhronizaciji', 'err');
    console.warn('Cloud sync:', e);
  }
}

async function startCloudSync(user) {
  if (!gcal.fb || !user?.uid) return;
  if (cloudSync.uid === user.uid && cloudSync.unsub) return;

  stopCloudSync();
  cloudSync.uid = user.uid;
  cloudSync.FM = gcal.fb.FM;
  cloudSync.db = gcal.fb.db;
  cloudSync.ready = false;
  cloudStatus('Nalagam podatke …', 'busy');

  const ref = cloudPath();
  const localApiKey = S.settings.apiKey || '';
  let needsCloudCleanup = false;
  try {
    const snap = await cloudSync.FM.getDoc(ref);
    if (snap.exists()) {
      const remote = snap.data()?.state;
      if (remote && typeof remote === 'object') {
        cloudSync.applyingRemote = true;
        const base = JSON.parse(JSON.stringify(DEFAULT));
        S = {
          ...base,
          ...remote,
          settings: { ...base.settings, ...(remote.settings || {}) },
          ui: { ...base.ui, ...(remote.ui || {}) }
        };
        S.settings.apiKey = localApiKey;
        S.settings.fbConfig = FIREBASE_CONFIG.apiKey ? '' : (S.settings.fbConfig || '');
        normalizeState(S);
        cleanupLegacyImages();
        needsCloudCleanup = stableJson(remote) !== stableJson(cloudState());
        store.set(JSON.stringify(S));
        cloudSync.lastJson = needsCloudCleanup ? JSON.stringify(remote) : cloudJson();
        cloudSync.applyingRemote = false;
        render();
        toast('Podatki so bili naloženi iz oblaka.');
      }
    } else {
      // Prva prijava tega računa: obstoječe lokalne podatke prenesemo v cloud.
      cloudSync.ready = true;
      await pushCloudState();
      cloudStatus('Sinhronizirano', 'ok');
    }

    cloudSync.ready = true;
    if (needsCloudCleanup) {
      cloudSync.pending = true;
      await pushCloudState();
    }
    cloudSync.unsub = cloudSync.FM.onSnapshot(ref, snap2 => {
      if (!snap2.exists()) return;
      const remote = snap2.data()?.state;
      if (!remote || typeof remote !== 'object') return;
      const json = JSON.stringify(remote);
      if (json === cloudSync.lastJson) return;
      // Lastni zapis, ki še ni potrjen, ali lokalne spremembe, ki še niso poslane: ne prepisuj z starejšim stanjem.
      if (snap2.metadata && snap2.metadata.hasPendingWrites) return;
      if ((cloudSync.dirty || cloudSync.pending) && Date.now() - (cloudSync.dirtyAt || 0) < 15000) return;
      if (stableJson(remote) === stableJson(cloudState())) { cloudSync.lastJson = cloudJson(); return; }

      cloudSync.applyingRemote = true;
      const localApiKey = S.settings.apiKey || '';
      // Remote sync posodobi podatke, ne pa navigacije/UI trenutne naprave.
      const localUi = JSON.parse(JSON.stringify(S.ui || DEFAULT.ui));
      const base = JSON.parse(JSON.stringify(DEFAULT));
      S = {
        ...base,
        ...remote,
        settings: { ...base.settings, ...(remote.settings || {}), apiKey: localApiKey },
        ui: localUi
      };
      normalizeState(S);
      cleanupLegacyImages();
      const needsCloudCleanup = stableJson(remote) !== stableJson(cloudState());
      store.set(JSON.stringify(S));
      cloudSync.lastJson = needsCloudCleanup ? JSON.stringify(remote) : cloudJson();
      cloudSync.applyingRemote = false;
      if (needsCloudCleanup) scheduleCloudSave();
      render();
      cloudStatus('Posodobljeno', 'ok');
    }, err => {
      cloudStatus('Sinhronizacija ni na voljo', 'err');
      console.warn('Firestore listener:', err);
    });

    cloudStatus('Sinhronizirano', 'ok');
    refreshGoogleUi();
  } catch (e) {
    cloudSync.ready = false;
    cloudStatus('Cloud sync ni uspela', 'err');
    toast(`Sinhronizacija: ${e.code === 'permission-denied' ? 'preveri Firestore pravila.' : (e.message || 'napaka')}`);
  }
}

function stopCloudSync() {
  if (cloudSync.unsub) { try { cloudSync.unsub(); } catch (e) {} }
  cloudSync.unsub = null;
  clearTimeout(cloudSync.timer);
  cloudSync.timer = null;
  cloudSync.uid = null;
  cloudSync.FM = null;
  cloudSync.db = null;
  cloudSync.ready = false;
  cloudSync.pending = false;
  cloudSync.lastJson = '';
  cloudStatus('Ni povezano', '');
}

function gotCred(result) {

}
function clearGToken() { gcal.token = null; gcal.exp = 0; gcal.events = []; gcal.eventsTmr = []; gcal.calendars = []; gtask.lists = []; gtask.loadedAt = 0; gtask.err = null; try { localStorage.removeItem('lf.gtoken'); } catch (e) {} }

async function gSignOut() {

/* ---------- Gmail → Inbox (predlogi, ki jih potrdiš) ---------- */
const GMAIL_DEFAULT_Q = 'in:inbox newer_than:3d -category:promotions -category:social -category:forums';
/* Uporabnik izbira v naravnem jeziku (predali, obdobje, kaj preskočiti); Gmail iskalni niz se sestavi v ozadju. */
const GM_BOXES = [['inbox', 'Prejeto', 'in:inbox'], ['sent', 'Poslano', 'in:sent'], ['important', 'Pomembno', 'is:important'], ['starred', 'Z zvezdico', 'is:starred'], ['drafts', 'Osnutki', 'in:drafts'], ['spam', 'Neželena pošta', 'in:spam'], ['trash', 'Smetnjak', 'in:trash'], ['all', 'Vsa pošta', '']];
const GM_PERIODS = [['1', 'Zadnjih 24 ur'], ['2', 'Zadnja 2 dni'], ['3', 'Zadnje 3 dni'], ['7', 'Zadnji teden'], ['14', 'Zadnja 2 tedna'], ['30', 'Zadnji mesec'], ['0', 'Brez omejitve']];
const GM_SKIP = [['promotions', 'Oglase', 'promotions'], ['social', 'Družabna obvestila', 'social'], ['forums', 'Forume', 'forums'], ['updates', 'Obvestila (računi, potrdila)', 'updates']];
function gmailFilterCfg() {
  const f = (S.settings && S.settings.gmailFilter) || {};
  const boxes = Array.isArray(f.boxes) ? f.boxes.filter(b => GM_BOXES.some(x => x[0] === b)) : ['inbox'];
  return {
    boxes,
    period: GM_PERIODS.some(x => x[0] === String(f.period)) ? String(f.period) : '3',
    skip: Array.isArray(f.skip) ? f.skip.filter(k => GM_SKIP.some(x => x[0] === k)) : [],
    unread: !!f.unread,
    extra: String(f.extra || '').slice(0, 200)
  };
}
function gmailQuery() {
  const c = gmailFilterCfg(), parts = [];
  const boxes = c.boxes.length ? c.boxes : ['inbox'];
  if (!boxes.includes('all')) { const q = boxes.map(b => GM_BOXES.find(x => x[0] === b)[2]); parts.push(q.length > 1 ? '(' + q.join(' OR ') + ')' : q[0]); }
  if (c.period !== '0') parts.push('newer_than:' + c.period + 'd');
  if (c.unread) parts.push('is:unread');
  c.skip.forEach(k => parts.push('-category:' + k));
  if (c.extra.trim()) parts.push(c.extra.trim());
  return (parts.join(' ') || GMAIL_DEFAULT_Q).slice(0, 300);
}
function gmailSummary() {
  const c = gmailFilterCfg(), names = c.boxes.map(b => GM_BOXES.find(x => x[0] === b)[1]);
  const list = names.length ? names.join(', ').replace(/, ([^,]*)$/, ' in $1') : 'Prejeto (nič ni izbrano, zato se uporabi privzeto)';
  const per = (GM_PERIODS.find(x => x[0] === c.period) || GM_PERIODS[2])[1].toLowerCase();
  const sk = c.skip.map(k => GM_SKIP.find(x => x[0] === k)[1].replace(/ \(.*\)/, '').toLowerCase());
  return `Pregledalo se bo: <strong>${esc(list)}</strong> · ${esc(per)}${c.unread ? ' · samo neprebrana' : ''}${sk.length ? ' · brez: ' + esc(sk.join(', ')) : ''}.`;
}
function gmailSettingsHtml() {
  const c = gmailFilterCfg();
  const chip = (k, v, label, on) => `<label class="work-day"><input type="checkbox" data-gm="${k}" data-v="${v}" ${on ? 'checked' : ''}><span>${esc(label)}</span></label>`;
  return `<div class="field"><label>Kateri e-poštni predali se pregledajo</label><div class="work-days">${GM_BOXES.map(b => chip('box', b[0], b[1], c.boxes.includes(b[0]))).join('')}</div></div>
    <div class="field"><label for="gmPeriod">Za katero obdobje</label><select id="gmPeriod" data-gm="period">${GM_PERIODS.map(([v, l]) => `<option value="${v}" ${v === c.period ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Kaj preskočiti</label><div class="work-days">${GM_SKIP.map(b => chip('skip', b[0], b[1], c.skip.includes(b[0]))).join('')}</div></div>

const idb = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('lifeflow-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('img');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('img', mode), req = fn(t.objectStore('img'));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  clear() { return this.tx('readwrite', s => s.clear()); }
};

function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

}

const capFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function splitVoiceTasks(text) {
  return String(text || '').replace(/\s+/g, ' ').trim().replace(/[.?!]+$/, '')
    .split(/\s*[,;]\s*|\s+ter\s+|[.?!]\s+/i).map(x => capFirst(x.trim())).filter(Boolean).slice(0, 12);
}

function toggleQuickVoice(kind) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Ta brskalnik ne podpira glasovnega vnosa. Poskusi Chrome na telefonu ali računalniku.'); return; }
  if (quickRecognition) { try { quickRecognition.stop(); } catch(e){}; return; }
  const cfg = kind === 'cap' ? { input: '#capText', btn: '[data-act="capDictate"]' }
    : kind === 'agent' ? { input: '#agentText', btn: '[data-act="agentDictate"]' }
    : kind === 'note' ? { input: '#noteText', btn: '[data-act="noteDictate"]' }
    : { input: '#quickTask', btn: '[data-act="taskVoice"]' };
  const input = $(cfg.input); if (!input) return;
  const btn = $(cfg.btn);
  const base = (kind === 'cap' || kind === 'note' || kind === 'agent') ? (input.value || '').trim() : '';
  const r = new SR(); quickRecognition = r;
  r.lang = 'sl-SI'; r.interimResults = true; r.continuous = false;
  if (btn) btn.classList.add('recording');
  r.onresult = ev => {
    let finalText = '', interim = '';
    for (const res of ev.results) { const txt = res[0]?.transcript || ''; res.isFinal ? finalText += txt : interim += txt; }
    input.value = [base, finalText.trim(), interim.trim()].filter(Boolean).join(' ');
    if (kind === 'cap') cap.text = input.value;
  };
  r.onerror = ev => { toast(ev.error === 'not-allowed' ? 'Dovoli mikrofon za glasovni vnos.' : 'Glasovnega vnosa ni bilo mogoče uporabiti.'); quickRecognition = null; if (btn) btn.classList.remove('recording'); };
  r.onend = () => {
    quickRecognition = null; if (btn) btn.classList.remove('recording');
    const textNow = (input.value || '').trim(); if (!textNow) return;
    if (kind === 'cap') { cap.text = input.value; return; }
    if (kind === 'agent') return;
    if (kind === 'note') { if (noteForm) noteForm.text = input.value; return; }
    const titles = splitVoiceTasks(textNow);
    if (!titles.length) return;
    addTasksFromText(titles); input.value = ''; save(); render();
    toast(titles.length === 1 ? `Opravilo dodano: ${titles[0]}` : `Dodanih opravil: ${titles.length}`);
  };
  try { r.start(); } catch(e) { quickRecognition = null; if (btn) btn.classList.remove('recording'); toast('Glasovnega vnosa ni bilo mogoče zagnati.'); }
}

let tabSwipe = null;
function canTabSwipe(el) {
  if (sheet.open) return false;
  if (!el || !el.closest) return false;
  if (el.closest('input,textarea,select,[contenteditable="true"],.seg,.cal-grid,.time-range')) return false;
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    if (n.scrollWidth > n.clientWidth + 4) {
      const ox = getComputedStyle(n).overflowX;
      if (ox === 'auto' || ox === 'scroll') return false;
    }
  }
  return true;
}
document.addEventListener('touchstart', e => {
  tabSwipe = null;
  if (e.touches.length !== 1 || !canTabSwipe(e.target)) return;
  const t = e.touches[0];
  tabSwipe = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!tabSwipe) return;
  const s = tabSwipe; tabSwipe = null;
  if (sheet.open) return;
  const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Date.now() - s.t > 800 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  const i = NAV.findIndex(n => n[0] === S.ui.tab), j = i + (dx < 0 ? 1 : -1);
  if (i < 0 || j < 0 || j >= NAV.length) return;
  A.tab({ dataset: { tab: NAV[j][0] } });
  const v = $('#view');
  if (v && v.animate && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    v.animate([{ transform: `translateX(${dx < 0 ? 36 : -36}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 220, easing: 'ease-out' });
  }
}, { passive: true });
document.addEventListener('touchcancel', () => { tabSwipe = null; });

async function agentLoop() {

      agent.contents.push(content);
      const parts = arr(content.parts);
      const calls = parts.filter(p => p.functionCall);
      const text = parts.filter(p => p.text && !p.thought).map(p => p.text).join('').trim();
      if (!calls.length && !fakeRetry && /predlagaj_\w+\s*\(/.test(text)) {

      if (!calls.length) break;

      if (step === AGENT_MAX_STEPS - 1) agent.msgs.push({ role: 'ai', text: 'Dosegel sem omejitev korakov. Povej, če naj nadaljujem.' });
    }
    /* uspešen zagon: zapomni si pregledano pošto in čas pregleda */
    batch.mailIds.forEach(id => { S.agentMem.mail[id] = today(); });

function finReadForm() {
  if (!finForm) return null;
  const f={...finForm};
  ['title','category','amount','startMonth','endMonth','interval','paymentMethod','date','expiry','note','baseEnd','noticeSentOn'].forEach(k=>{const el=$('#fin_'+k);if(el)f[k]=el.value;});
  const paid=$('#fin_paid');if(paid)f.paid=paid.checked;
  return f;
}
