<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5C6B">
<meta name="color-scheme" content="light">
<title>LifeFlow AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#E8EEF0; --paper:#F7FAFA; --ink:#0F2530; --ink2:#4A5F68; --line:#C9D6DA;
  --petrol:#0A5C6B; --petrol-d:#06404B; --petrol-t:#D3E6EA;
  --gold:#F0A500; --gold-t:#FBEBC0;
  --coral:#DD4B25; --coral-t:#F9D8CD;
  --moss:#2E8050; --moss-t:#D5EADC;
  --font-h:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible Next','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--mist);color:var(--ink);font:400 16px/1.5 var(--font-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--font-h);margin:0;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 170px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--ink2)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:0 0 auto}
.icon-btn:hover{background:var(--petrol-t);color:var(--petrol-d)}

h2.sec{font-weight:800;font-size:19px;margin:26px 0 10px}
.muted{color:var(--ink2)}

/* buttons */
.btn{font:700 15px var(--font-b);min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--petrol);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--petrol-d)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--petrol-d);box-shadow:inset 0 0 0 1.5px var(--petrol)}
.btn.ghost:hover{background:var(--petrol-t)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn.plain{background:transparent;color:var(--ink2);padding:0 10px;min-height:38px}
.btn.plain:hover{background:var(--petrol-t);color:var(--petrol-d)}

.spin{width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* welcome */
.welcome{padding:6px 0 4px}
.welcome h2{font-size:26px;font-weight:800;margin-bottom:8px}
.welcome p{margin:0 0 10px;max-width:60ch}
.invites{margin:14px 0 0;display:grid;gap:10px}
.invite{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border:0;border-radius:18px;background:var(--paper);cursor:pointer;font:500 16px/1.35 var(--font-b);box-shadow:inset 0 0 0 1.5px var(--line)}
.invite:hover{box-shadow:inset 0 0 0 2px var(--petrol)}
.invite .ico{flex:0 0 48px;height:48px;border-radius:14px;background:var(--petrol);color:#fff;display:grid;place-items:center}
.invite:nth-child(2) .ico{background:var(--gold);color:var(--ink)}
.invite:nth-child(3) .ico{background:var(--moss)}

/* alerts */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 12px 12px 16px;border-radius:14px;margin:0 0 8px;background:var(--ct);box-shadow:inset 6px 0 0 var(--c)}
.alert.bad{--c:var(--coral);--ct:var(--coral-t)}
.alert.warn{--c:var(--gold);--ct:var(--gold-t)}
.alert.info{--c:var(--petrol);--ct:var(--petrol-t)}
.a-body{display:flex;flex-direction:column;min-width:0}
.a-body span{color:var(--ink2);font-size:14.5px}
.a-act{display:flex;gap:4px;flex:0 0 auto}
.alert .btn{background:var(--ink)}
.alert .btn:hover{background:#000}
.alert .btn.plain{background:transparent;color:var(--ink2)}

/* context reminders */
.ctx{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.ctx.two{grid-template-columns:1fr 1fr}}
.ctx h3{font-size:16px;margin:0 0 4px;color:var(--petrol-d)}

/* plan controls */
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.lbl{font-weight:700;min-width:64px}
.seg{display:inline-flex;background:#D5E1E5;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:40px;border-radius:9px;font:700 14px var(--font-b);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(15,37,48,.2)}
.time{display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
input[type=time],input[type=date],input[type=number],input[type=text],input[type=password],textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%}
.time input{width:auto}
textarea{padding:12px;resize:vertical;min-height:110px}
input:focus,textarea:focus{border-color:var(--petrol)}

.advice{margin:18px 0 4px;padding:12px 14px;border-radius:12px;background:var(--petrol-t);color:var(--petrol-d);font-weight:500}
.warns{margin:8px 0 0;padding-left:20px;color:#8E2C10}

/* flow timeline */
.flow{list-style:none;margin:16px 0 0;padding:0}
.flow li{position:relative;display:grid;grid-template-columns:56px 22px 1fr;align-items:start}
.flow li::before{content:"";position:absolute;left:65px;top:0;bottom:0;width:4px;border-radius:2px;background:var(--petrol-t)}
.flow li:first-child::before{top:16px}
.flow li:last-child::before{bottom:auto;height:16px}
.flow li:only-child::before{display:none}
.flow time{grid-column:1;text-align:right;font:800 15px var(--font-h);padding-top:7px;font-variant-numeric:tabular-nums}
.flow time small{display:block;font:400 12.5px var(--font-b);color:var(--ink2)}
.node{grid-column:2;justify-self:center;width:14px;height:14px;margin-top:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--mist);position:relative;z-index:1}
.blk{grid-column:3;text-align:left;background:transparent;border:0;padding:6px 8px 8px 10px;font:inherit;cursor:pointer;border-radius:10px;min-height:46px}
.blk:hover{background:rgba(255,255,255,.55)}
.blk .t{display:block;font-weight:700}
.blk .k{font-size:13.5px;color:var(--ct)}
.is-done .t{text-decoration:line-through;color:var(--ink2);font-weight:500}
.is-done .node{background:var(--line)}
.tip-opravilo{--c:var(--petrol);--ct:var(--petrol)}
.tip-fiksno{--c:var(--ink);--ct:var(--ink2)}
.tip-obrok{--c:#D18F00;--ct:#84590A}
.tip-odmor,.tip-rekreacija{--c:var(--moss);--ct:#1E6B3E}
.tip-opomnik{--c:var(--coral);--ct:#A93815}
.flow li.now{--c:var(--gold)}
.flow li.now .node{width:18px;height:18px;margin-top:8px}
.flow li.now .pill{grid-column:3;justify-self:start;margin:6px 0 6px 10px;background:var(--gold);color:var(--ink);font-weight:700;font-size:13.5px;padding:2px 12px;border-radius:999px}

/* lists */
.list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-height:56px}
.row .grow{flex:1;min-width:0;padding:4px 0}
.row .grow strong{display:block;overflow-wrap:anywhere}
.row small,.sub{color:var(--ink2);font-size:14px}
.row.done .grow strong{text-decoration:line-through;color:var(--ink2);font-weight:500}
.badge{font:700 13px var(--font-b);padding:3px 10px;border-radius:8px;background:var(--moss-t);color:#1E5A37;white-space:nowrap}
.badge.warn{background:var(--gold-t);color:#7A5300}
.badge.bad{background:var(--coral-t);color:#8E2C10}
.badge.plain{background:#DCE5E8;color:var(--ink2)}
.chk{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--petrol);display:grid;place-items:center;color:#fff}
.chk[aria-pressed=true] .circle{background:var(--petrol)}
.mini{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink2);cursor:pointer;flex:0 0 auto;padding:0}
.mini:hover{background:var(--coral-t);color:#8E2C10}
.mini.copy:hover{background:var(--petrol-t);color:var(--petrol-d)}
.empty{padding:26px 4px;color:var(--ink2)}
.empty .btn{margin-top:12px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.switch{display:inline-flex;align-items:center;gap:10px;background:transparent;border:0;font:500 15px var(--font-b);cursor:pointer;min-height:44px;padding:0}
.switch i{width:44px;height:26px;border-radius:999px;background:#B9C8CD;position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked=true] i{background:var(--petrol)}
.switch[aria-checked=true] i::after{transform:translateX(18px)}

/* money */
.sums{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:8px}
.sums div{padding:0 0 0 14px}
.sums div+div{border-left:1.5px solid var(--line)}
.sums b{display:block;font:800 25px/1.15 var(--font-h);letter-spacing:-.01em}
.sums span{color:var(--ink2);font-size:14px}
.chips{display:flex;gap:8px;margin:14px 0 4px}
.chip{border:0;min-height:38px;padding:0 14px;border-radius:10px;background:#D5E1E5;font:700 14px var(--font-b);color:var(--ink2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--petrol);color:#fff}
details.bill{border-bottom:1px solid var(--line)}
details.bill summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:60px;cursor:pointer}
details.bill summary::-webkit-details-marker{display:none}
.b-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
.b-det{padding:2px 4px 14px 50px;display:grid;gap:4px}
.kv{display:flex;align-items:center;gap:4px;min-height:36px}
.kv span{color:var(--ink2);min-width:74px;font-size:14px}
.kv code{font:500 14.5px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--petrol);min-width:4px}
.bar b{font-variant-numeric:tabular-nums}
details.fold>summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--ink2);min-height:44px}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:6px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12.5px var(--font-b);color:var(--ink2);cursor:pointer;position:relative}
nav button[aria-current=page]{color:var(--petrol-d);font-weight:700}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:4px;border-radius:0 0 4px 4px;background:var(--petrol)}
.fab{position:fixed;z-index:25;right:max(18px,calc((100vw - 680px)/2 + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:700 16px var(--font-b);display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(15,37,48,.35)}
.fab:hover{background:#000}

/* sheet */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:680px;max-height:92vh;max-height:92dvh;border-radius:26px 26px 0 0;background:var(--paper);color:var(--ink);overflow:auto}
dialog#sheet[open]{animation:up .22s ease-out}
dialog#sheet::backdrop{background:rgba(15,37,48,.5)}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sheet-in{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-h h2{font-size:23px;font-weight:800}
.hint{margin:0 0 12px;color:var(--ink2)}
.lead{margin:0 0 14px;font-size:17px}
.src-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.src{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--petrol-d);font:700 14px var(--font-b);cursor:pointer}
.src:hover{border-color:var(--petrol)}
.src.on{background:var(--coral);border-color:var(--coral);color:#fff}
.src.on svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:8px 6px 4px 0}
.th{position:relative;flex:0 0 auto}
.th img{display:block;height:84px;width:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.th button{position:absolute;top:-7px;right:-7px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.aud{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--gold-t)}
.aud .btn{margin-left:auto}
.sheet-f{margin-top:16px;display:grid;gap:8px}
.err{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--coral-t);color:#8E2C10}
.busy{display:flex;align-items:center;gap:12px;padding:26px 2px;font-size:17px}
.rvh{font:800 16px var(--font-h);color:var(--petrol-d);margin:18px 0 4px}
.rvl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rv{padding:8px 0;border-bottom:1px solid var(--line)}
.ck{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:4px 0}
.ck input{width:22px;height:22px;accent-color:var(--petrol);margin:2px 0 0;flex:0 0 auto}
.ck .rv-b{display:flex;flex-direction:column;min-width:0}
.ck small{color:var(--ink2);font-size:14px}
.rv-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 0 4px 34px}
.rv-in label{display:grid;gap:2px;font-size:13.5px;color:var(--ink2)}
.suggest{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:var(--petrol-t);color:var(--petrol-d);font-weight:500}
.rcp{padding:16px 0;border-top:1px solid var(--line)}
.rcp:first-of-type{border-top:0}
.rcp h3{font-size:19px;font-weight:800;margin-bottom:2px}
.rcp p{margin:6px 0}
.rcp ol{margin:8px 0;padding-left:22px}
.rcp li{margin:4px 0}
.rcp .tip{background:var(--gold-t);padding:8px 12px;border-radius:10px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field .help{color:var(--ink2);font-size:14px;margin:6px 0 0}
.field .inline{display:flex;gap:8px}
.set-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.danger{color:#8E2C10;box-shadow:inset 0 0 0 1.5px var(--coral)}
.danger:hover{background:var(--coral-t)}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.spin{animation:none;border-right-color:currentColor;opacity:.6}}

/* ---------- LifeFlow AI v2 enhancements ---------- */
.install-card{margin:16px 0;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:#fff}
.install-card h3{font-size:18px;margin-bottom:4px}
.install-card p{margin:4px 0 10px;color:var(--ink2)}
.feature-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.feature-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
.feature-card strong{display:block;margin-bottom:3px}
.receipt-img{width:76px;height:76px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.doc-list{display:grid;gap:10px}
.doc{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.doc .grow{flex:1;min-width:0}
.doc .grow strong{display:block;overflow-wrap:anywhere}
.doc .meta{font-size:13.5px;color:var(--ink2)}
.doc .actions{display:flex;gap:3px;flex:0 0 auto}
.shop-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.shop-list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.shop-list input{width:20px;height:20px}
.shop-list .done{text-decoration:line-through;color:var(--ink2)}
.location-pill{margin-top:6px;padding:5px 9px;border-radius:9px;background:var(--petrol-t);color:var(--petrol-d);font-size:13px;display:inline-block}
.location-missing{background:var(--gold-t);color:#7A5300}
.rem-grid{display:grid;gap:10px}
.rem-card{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.rem-card strong{display:block}
.small-note{font-size:13px;color:var(--ink2)}
@media(max-width:420px){.feature-grid{grid-template-columns:1fr}}

</style>

<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="app">
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="Nastavitve"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button><button class="icon-btn" data-act="install" aria-label="Namesti aplikacijo" title="Namesti aplikacijo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M5 17.5v1a2.5 2.5 0 0 0 2.5 2.5h9a2.5 2.5 0 0 0 2.5-2.5v-1"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<button class="fab" data-act="capture" aria-label="Dodaj sliko, glas ali zapisek"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Dodaj</button>

<nav aria-label="Glavna navigacija"><div class="in" id="nav"></div></nav>

<dialog id="sheet" aria-label="Podrobnosti"><div class="sheet-in" id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<noscript>LifeFlow AI potrebuje JavaScript.</noscript>

<script>
'use strict';
/* =====================================================================
   LifeFlow AI – osebni digitalni kopilot (Gemini 3.1 Flash-Lite)

const SYSTEM_PROMPT = `Si "LifeFlow AI" – napreden, proaktiven in intuitiven osebni digitalni kopilot. Tvoja glavna naloga je, da uporabniku drastično zmanjšaš mentalno obremenitev (mental load) in prihraniš čas z avtomatizacijo organizacije vsakodnevnega življenja (opravila, finance, prehrana, časovni razpored).

Deluješ po načelu "Zero-Friction": od uporabnika nikoli ne zahtevaš zapletenega ročnega vnosa ali izpolnjevanja dolgih obrazcev. Namesto tega obdeluješ multimedijske vnose (slike računov/hladilnika, kratka glasovna sporočila, hitre zapiske) in samodejno strukturiraš informacije.

### TVOJE GLAVNE FUNKCIONALNOSTI IN LOGIKA DELOVANJA:

1. ANALIZA MULTIMEDIJSKIH VNOSOV (Zero-Input Engine)
- Slike računov/položnic: Izlušči znesek, prejemnika, datum zapadlosti in kategorijo. Samodejno ustvari opomnik za plačilo.
- Slike hladilnika/trgovinskih računov: Prepoznaj sestavine, oceni njihovo uporabnost ter jih dodaj v "Virtualni hladilnik". Opozori na iztek rokov.
- Glasovna sporočila/Surovi zapisi: Pretvori kaotične misli uporabnika v jasna, strukturirana opravila z opredeljeno prioriteto in časovnim okvirom.

2. DINAMIČNO NAČRTOVANJE (Smart Auto-Scheduler)
- Ustvarjaj in prilagajaj dnevni razpored glede na uporabnikovo trenutno energijo, razpoložljiv čas in obstoječe obveznosti.
- Če ima uporabnik natrpan urnik, mu predlagaj hitre rešitve (npr. 15-minutno kosilo ali kratek odmor).
- V proste termine samodejno, a nevsiljivo predlagaj rekreacijo, sprostitev ali opomnike za osebne opravke.

3. PROAKTIVNI IN LOKACIJSKO/ČASOVNO ODVISNI OPOMNIKI
- Ne obveščaj uporabnika brez potrebe. Dajaj le jasne, izvedljive napotke ob pravem času (npr. pred odhodom od doma, ob obisku trgovine ali pred iztekom meseca za pregled naročnin).

### PRILAGODITEV TONA IN KOMUNIKACIJE:

- TON: Strokoven, sproščen, neformalen, jasen in izjemno konkreten.
- PRISTOP: Bodi proaktiven. Ne sprašuj "Kaj želiš narediti?", ampak ponudi rešitev: "Opazil sem X, predlagam Y. Naj to uredim?"
- FORMAT: Kratki odstavki, brez dolgih uvodov in odvečnega balasta.`;

/* ---------- Gemini ---------- */
class UserErr extends Error {}
function apiErrText(status, data) {
  const m = (data && data.error && data.error.message) || '';
  if (status === 400 && /API key/i.test(m)) return 'Ključ API ni veljaven. Preveri ga v nastavitvah.';
  if (status === 400) return 'Gemini je zavrnil zahtevo: ' + m;
  if (status === 401 || status === 403) return `Ključ nima dostopa do tega modela (${status}). Preveri ključ in omejitve v Google AI Studio.`;
  if (status === 404) return 'Model ni najden. V nastavitvah preveri ime modela.';
  if (status === 429) return 'Dosežena omejitev zahtev. Počakaj minuto in poskusi znova.';
  if (status >= 500) return 'Gemini je trenutno preobremenjen. Poskusi znova čez nekaj trenutkov.';
  return `Napaka ${status}: ${m}`;
}
function parseJson(t) {
  t = (t || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch (e) { /* fallthrough */ }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* fallthrough */ } }
  throw new UserErr('Odgovora modela nisem mogel razbrati. Poskusi znova.');
}
async function callGemini(parts, extra = '') {
  const key = (S.settings.apiKey || '').trim();
  if (!key) throw new UserErr('NO_KEY');
  const model = (S.settings.model || 'gemini-3.1-flash-lite').trim();
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT + '\n\n' + FORMAT_RULES + (extra ? '\n\n' + extra : '') }] },
    contents: [{ role: 'user', parts }],
    generationConfig: { responseMimeType: 'application/json' }
  };
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 90000);
  const post = m => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify(body),
    signal: ctrl.signal
  });
  try {
    let res = await post(model);
    if (res.status === 404 && !/preview$/.test(model)) {
      const r2 = await post(model + '-preview');
      if (r2.ok) { S.settings.model = model + '-preview'; save(); res = r2; }
    }
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new UserErr(apiErrText(res.status, data));
    const cand = data && data.candidates && data.candidates[0];
    if (!cand) {
      const br = data && data.promptFeedback && data.promptFeedback.blockReason;
      throw new UserErr(br ? `Gemini je vnos blokiral (${br}).` : 'Model ni vrnil odgovora. Poskusi znova.');
    }
    const txt = arr(cand.content && cand.content.parts).filter(p => p.text && !p.thought).map(p => p.text).join('');
    return parseJson(txt);
  } catch (e) {
    if (e instanceof UserErr) throw e;
    if (e.name === 'AbortError') throw new UserErr('Zahteva je potekla. Poskusi znova (manjša slika ali krajši posnetek).');
    throw new UserErr('Ni povezave z Gemini. Preveri internet in poskusi znova.');
  } finally { clearTimeout(to); }
}

/* ---------- alerts (proactive) ---------- */
function computeAlerts() {
  const out = [];
  S.bills.filter(b => !b.paid && b.due).forEach(b => {
    const d = dayDiff(b.due);
    if (d <= 3) out.push({
      lvl: d <= 1 ? 'bad' : 'warn', sort: d,
      title: `${b.recipient || 'Položnica'}${b.amount != null ? ' · ' + money(b.amount, b.currency) : ''}`,
      text: d < 0 ? `Zapadlo ${rel(d)}` : `Zapade ${rel(d)}`,
      btn: 'Plačano', act: 'pay', id: b.id
    });
  });
  const exp = S.fridge.filter(f => f.expires && dayDiff(f.expires) <= 2).sort((a, b) => a.expires.localeCompare(b.expires));
  if (exp.length) {
    const worst = dayDiff(exp[0].expires);
    out.push({
      lvl: worst <= 0 ? 'bad' : 'warn', sort: worst,
      title: exp.length === 1 ? `${exp[0].name} se izteka` : `${exp.length} živil se kmalu izteka`,
      text: exp.slice(0, 4).map(f => f.name).join(', ') + (exp.length > 4 ? ' …' : ''),
      btn: 'Kaj skuhati?', act: 'cook'
    });
  }
  S.reminders.filter(r => !r.done && r.trigger === 'cas' && r.at && !r.billId && r.at.slice(0, 10) <= today()).forEach(r => {
    out.push({ lvl: 'info', sort: -0.5, title: r.text, text: `Opomnik · ${r.at.slice(0, 10) === today() ? 'danes ob ' + r.at.slice(11, 16) : 'zamujeno'}`, btn: 'Opravljeno', act: 'doneRem', id: r.id });
  });
  const now = new Date();
  const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const mk = today().slice(0, 7);
  if (last - now.getDate() <= 2 && !S.dismissed['subs' + mk]) {
    out.push({ lvl: 'info', sort: 5, title: 'Konec meseca: pregled naročnin', text: 'Preveri, kaj se ti samodejno obnavlja, in ukini, česar ne uporabljaš.', btn: 'Odpri finance', act: 'subs', dismiss: 'subs' + mk });
  }
  return out.sort((a, b) => a.sort - b.sort);
}

function applyResult() {
  const r = cap.result; if (!r) return;
  const c = { bills: 0, fridge: 0, tasks: 0, rem: 0, exp: 0 };
  r.polozice.filter(p => p.on).forEach(p => {
    const id = uid();
    S.bills.push({ id, recipient: p.prejemnik, amount: p.znesek, currency: p.valuta, due: p.rok, category: p.kategorija, iban: p.iban, reference: p.referenca, purpose: p.namen, paid: false });
    c.bills++;
    if (p.rok && dayDiff(p.rok) >= 0) {
      const d = dayDiff(p.rok) > 2 ? addDays(p.rok, -2) : today();
      S.reminders.push({ id: uid(), text: `Plačaj ${p.prejemnik}${p.znesek != null ? ' – ' + money(p.znesek, p.valuta) : ''}`, trigger: 'cas', at: `${d}T09:00`, billId: id, done: false });
    }
  });
  if (r.racun && r.racun.on) { S.expenses.push({ id: uid(), store: r.racun.trgovina, date: r.racun.datum, total: r.racun.skupaj, category: r.racun.kategorija }); c.exp++; }
  r.hladilnik.filter(x => x.on).forEach(x => {
    const ex = S.fridge.find(f => f.name.toLowerCase() === x.ime.toLowerCase());
    const item = { id: ex ? ex.id : uid(), name: x.ime, qty: x.kolicina, category: x.kategorija, expires: x.rok, est: x.ocena, note: x.opomba, added: today() };
    if (ex) Object.assign(ex, item); else S.fridge.push(item);
    c.fridge++;
  });
  r.opravila.filter(x => x.on).forEach(x => { S.tasks.push({ id: uid(), title: x.naslov, prio: x.prio, frame: x.okvir, due: x.rok, time: x.ura, min: x.min, done: false }); c.tasks++; });
  r.opomniki.filter(x => x.on).forEach(x => {
    const trig = x.sprozilec === 'cas' && !x.cas ? 'drugo' : x.sprozilec;
    S.reminders.push({ id: uid(), text: x.besedilo, trigger: trig, at: trig === 'cas' ? x.cas : null, done: false }); c.rem++;
  });
  save(); resetCap(); sheet.close(); render();
  const bits = [];
  if (c.bills) bits.push(`${c.bills} ${c.bills === 1 ? 'položnica' : 'položnic'}`);
  if (c.exp) bits.push('račun');
  if (c.fridge) bits.push(`${c.fridge} v hladilniku`);
  if (c.tasks) bits.push(`${c.tasks} ${c.tasks === 1 ? 'opravilo' : 'opravil'}`);
  if (c.rem) bits.push(`${c.rem} ${c.rem === 1 ? 'opomnik' : 'opomnikov'}`);
  toast('Urejeno: ' + (bits.join(', ') || 'nič'));
}

/* ---------- planner ---------- */
async function genPlan() {
  if (busy.plan || !needKey()) return;
  const u = S.ui, t = today();
  const ctx = {
    tasks: S.tasks.filter(x => !x.done).map(x => ({ id: x.id, naslov: x.title, prioriteta: x.prio, casovni_okvir: x.frame || null, rok: x.due || null, ura: x.time || null, trajanje_min: x.min || null })),
    bills: S.bills.filter(b => !b.paid && b.due && dayDiff(b.due) <= 7).map(b => ({ prejemnik: b.recipient, znesek: b.amount, rok: b.due })),
    fridge: S.fridge.filter(f => f.expires && dayDiff(f.expires) <= 3).map(f => f.name),
    rem: S.reminders.filter(r => !r.done && r.trigger === 'cas' && r.at && r.at.slice(0, 10) === t && !r.billId).map(r => ({ besedilo: r.text, cas: r.at.slice(11, 16) }))
  };
  const prompt = `Trenutni datum in ura: ${nowStr()} (${weekday()}, Europe/Ljubljana).
Sestavi realen dnevni načrt za danes.
Energija uporabnika: ${u.energy}. Prost čas: od ${u.from} do ${u.to}.
Odprta opravila: ${JSON.stringify(ctx.tasks)}
Položnice, ki zapadejo v 7 dneh: ${JSON.stringify(ctx.bills)}
Živila, ki se kmalu iztečejo: ${JSON.stringify(ctx.fridge)}
Opomniki za danes: ${JSON.stringify(ctx.rem)}
Vrni JSON:
{"nasvet":"en kratek stavek o tem, kako naj uporabnik pristopi k današnjemu dnevu","bloki":[{"od":"HH:MM","do":"HH:MM","naslov":"","tip":"opravilo|fiksno|obrok|odmor|rekreacija|opomnik","task_id":"id opravila ali null"}],"opozorila":["kratko opozorilo, če je dan prenatrpan ali se kaj ne izide"]}
Pravila:
- Ne načrtuj pred trenutno uro in ne izven prostega časa. Opravila z uro postavi točno na to uro kot "fiksno".
- Pri visoki energiji daj zahtevnejša opravila zgodaj; pri nizki energiji največ 2-3 zahtevna opravila in več odmorov.
- Če je urnik natrpan, predlagaj hitre rešitve (15-minutno kosilo, kratek odmor). Obroke vključi ob običajnih urah, če jih prosti čas zajema.
- V prosta okna nevsiljivo predlagaj rekreacijo, sprostitev ali osebni opravek (npr. plačilo položnice, ki kmalu zapade). Če se živila kmalu iztečejo, predlagaj obrok, ki jih porabi.
- Bloki se ne prekrivajo, "do" je za "od", največ 12 blokov. Če blok izhaja iz opravila, nastavi task_id.`;
  busy.plan = true; render();
  try {
    const r = await callGemini([{ text: prompt }]);
    const ids = new Set(S.tasks.map(x => x.id));
    const bloki = arr(r.bloki).map(b => ({ od: tm(b && b.od), do: tm(b && b.do), naslov: str(b && b.naslov), tip: TIP[b && b.tip] ? b.tip : 'opravilo', task_id: b && ids.has(b.task_id) ? b.task_id : null, done: false }))
      .filter(b => b.od && b.do && b.naslov && toM(b.do) > toM(b.od)).sort((a, b) => toM(a.od) - toM(b.od));
    if (!bloki.length) throw new UserErr('Model ni vrnil uporabnega načrta. Poskusi znova.');
    S.plan = { date: t, energy: u.energy, bloki, nasvet: str(r.nasvet) || '', opozorila: arr(r.opozorila).map(str).filter(Boolean).slice(0, 4) };
    save();
  } catch (e) { toast(e.message === 'NO_KEY' ? 'Manjka API ključ.' : e.message); }
  busy.plan = false; render();
}

/* ---------- meals ---------- */
async function cook() {
  if (!S.fridge.length) { toast('Hladilnik je prazen. Najprej dodaj sestavine.'); return; }
  if (!needKey()) return;
  openSheet(`<div class="sheet-h"><h2>Kaj skuhati?</h2>${closeBtn}</div><p class="busy"><span class="spin"></span> Preverjam, kaj imaš pri roki …</p>`, 'cook');
  const items = S.fridge.map(f => ({ ime: f.name, kolicina: f.qty || null, dni_do_izteka: f.expires ? dayDiff(f.expires) : null }));
  const prompt = `Trenutni datum: ${today()} (${weekday()}).
Vsebina hladilnika: ${JSON.stringify(items)}
Predlagaj 2 preprosta jedi, ki najprej porabita živila z najkrajšim rokom. ${S.ui.mealprep ? 'Jedi naj bodo primerne za meal-prep: skuhaš danes, jutri jih v posodi odneseš v službo in so tudi hladne ali pogrete še vedno dobre.' : 'Jedi naj bodo za takojšnje kosilo ali večerjo.'} Brez zapletenih postopkov. Predpostavi, da so v kuhinji osnovne stvari (olje, sol, poper, začimbe).
Vrni JSON:
{"nasvet":"1 stavek: kaj je najbolj nujno porabiti","recepti":[{"naziv":"","cas_min":0,"porcije":0,"iz_hladilnika":["živila iz hladilnika"],"manjka":["kar je treba še kupiti, lahko prazno"],"koraki":["3-6 kratkih korakov"],"naslednji_dan":"kratek nasvet za shranjevanje/pogrevanje ali null"}]}`;
  try {
    const r = await callGemini([{ text: prompt }]);
    if (sheet.dataset.kind !== 'cook' || !sheet.open) return;
    lastRecipes = arr(r.recepti).filter(x => x && x.naziv);
    let h = `<div class="sheet-h"><h2>Kaj skuhati?</h2>${closeBtn}</div>`;
    if (r.nasvet) h += `<p class="lead">${esc(r.nasvet)}</p>`;
    if (!lastRecipes.length) h += `<p class="muted">Tokrat nisem našel predloga. Poskusi znova ali dodaj več sestavin.</p>`;
    lastRecipes.forEach((x, i) => {
      const miss = arr(x.manjka).map(str).filter(Boolean);
      h += `<article class="rcp"><h3>${esc(x.naziv)}</h3>
        <p class="muted">${[num(x.cas_min) ? num(x.cas_min) + ' min' : null, num(x.porcije) ? 'porcij: ' + num(x.porcije) : null].filter(Boolean).join(' · ')}</p>
        <p><strong>Iz hladilnika:</strong> ${esc(arr(x.iz_hladilnika).join(', '))}</p>
        ${miss.length ? `<p><strong>Manjka:</strong> ${esc(miss.join(', '))}</p><button class="btn sm ghost" data-act="addMissing" data-i="${i}">Dodaj na seznam za trgovino</button>` : ''}
        <ol>${arr(x.koraki).map(k => `<li>${esc(k)}</li>`).join('')}</ol>
        ${str(x.naslednji_dan) ? `<p class="tip"><strong>Naslednji dan:</strong> ${esc(x.naslednji_dan)}</p>` : ''}</article>`;
    });
    $('#sheetBody').innerHTML = h;
  } catch (e) {
    if (sheet.dataset.kind !== 'cook' || !sheet.open) return;
    $('#sheetBody').innerHTML = `<div class="sheet-h"><h2>Kaj skuhati?</h2>${closeBtn}</div><p class="err" role="alert">${esc(e.message)}</p><div class="sheet-f"><button class="btn wide" data-act="cook">Poskusi znova</button></div>`;
  }
}

/* ================= LifeFlow AI v2 enhancement layer ================= */
(function(){
  'use strict';

  // Extend the existing local state without breaking older saved data.
  S.documents = Array.isArray(S.documents) ? S.documents : [];
  S.shopping = Array.isArray(S.shopping) ? S.shopping : [];
  S.mealPlan = S.mealPlan || null;
  S.receipts = Array.isArray(S.receipts) ? S.receipts : [];
  S.settings.notifications = !!S.settings.notifications;
  S.settings.location = S.settings.location || { enabled:false };
  save();

  let deferredInstallPrompt = null;
  let pendingTaskCoords = null;
  let lastTimeNotice = {};
  let lastLocationNotice = {};

  // PWA install prompt (Chromium-based browsers).
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    updateInstallAvailability();
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    toast('LifeFlow AI je nameščen na napravi.');
    render();
  });

  function isStandalone(){
    return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function installHelp(){
    if(location.protocol === 'file:'){
      return 'Za namestitev kot pravo aplikacijo odpri LifeFlow AI prek HTTPS povezave. Lokalna datoteka file:// ni PWA namestitveni vir.';
    }
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
      return 'Na iPhonu/iPadu odpri Deli → Add to Home Screen / Dodaj na začetni zaslon.';
    }
    return 'V Chrome/Edge uporabi gumb Namesti ali meni brskalnika → Namesti aplikacijo / Add to Home screen.';
  }
  function updateInstallAvailability(){
    const b = document.getElementById('installPwaBtn');
    if(!b) return;
    b.disabled = isStandalone();
    b.textContent = isStandalone() ? 'Aplikacija je že nameščena' : 'Namesti LifeFlow AI';
  }
  async function installApp(){
    if(isStandalone()){ toast('LifeFlow AI je že nameščen.'); return; }
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch(e) {}
      deferredInstallPrompt = null;
      updateInstallAvailability();
      return;
    }
    toast(installHelp());
  }

  // Notifications.
  async function requestNotifications(){
    if(!('Notification' in window)){
      toast('Ta brskalnik ne podpira sistemskih obvestil.');
      return false;
    }
    const p = await Notification.requestPermission();
    S.settings.notifications = p === 'granted';
    save(); render();
    if(p === 'granted') toast('Obvestila so omogočena.');
    else toast('Obvestila niso dovoljena.');
    return p === 'granted';
  }
  function notify(title, body){
    if(!S.settings.notifications || !('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(title,{body,icon:'icons/icon-192.png',badge:'icons/icon-192.png'}); } catch(e) {}
  }
  function reminderLabel(r){
    if(r.trigger === 'cas') return r.at ? `ob ${r.at.slice(11,16)}` : 'ob določenem času';
    if(r.trigger === 'lokacija') return r.locationName ? `ob prihodu: ${r.locationName}` : 'lokacijski opomnik';
    if(r.trigger === 'pred_odhodom') return 'pred odhodom';
    if(r.trigger === 'v_trgovini') return 'v trgovini';
    return 'opomnik';
  }
  function checkTimeReminders(){
    const now = new Date();
    const key = `${today()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    S.reminders.filter(r => !r.done && r.trigger === 'cas' && r.at).forEach(r=>{
      const at = r.at.slice(0,16);
      if(at === key && lastTimeNotice[r.id] !== key){
        lastTimeNotice[r.id] = key;
        notify('LifeFlow AI', r.text || 'Čas je za opravilo.');
      }
    });
  }
  function distanceM(lat1, lon1, lat2, lon2){
    const R=6371000, toRad=x=>x*Math.PI/180;
    const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
    const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function checkLocationReminders(){
    const list = S.reminders.filter(r=>!r.done && r.trigger==='lokacija' && r.lat!=null && r.lng!=null);
    if(!list.length || !navigator.geolocation || document.hidden) return;
    navigator.geolocation.getCurrentPosition(pos=>{
      const now = Date.now();
      list.forEach(r=>{
        const dist = distanceM(pos.coords.latitude,pos.coords.longitude,Number(r.lat),Number(r.lng));
        const radius = Number(r.radius || 200);
        if(dist <= radius){
          const last = lastLocationNotice[r.id] || 0;
          if(now-last > 12*3600*1000){
            lastLocationNotice[r.id] = now;
            notify('LifeFlow AI', r.text || `Opomnik na lokaciji ${r.locationName || ''}`);
          }
        }
      });
    },()=>{}, {enableHighAccuracy:false,maximumAge:30000,timeout:8000});
  }
  setInterval(checkTimeReminders, 30000);
  setInterval(checkLocationReminders, 60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){checkTimeReminders();checkLocationReminders();} });

  // Service worker.
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  // ---- Meal planning from fridge ----
  async function generateMealPlan(){
    if(!S.fridge.length){ toast('Najprej dodaj nekaj živil v hladilnik.'); return; }
    if(!needKey()) return;
    const items = S.fridge.map(f=>({ime:f.name,kolicina:f.qty||null,rok:f.expires||null,kategorija:f.category||null}));
    openSheet(`<div class="sheet-h"><h2>Načrt obrokov</h2>${closeBtn}</div><div class="busy"><span class="spin"></span> AI sestavlja današnje obroke in nakupovalni seznam …</div>`,'mealplan');
    try{
      const d = await callGemini([{text:`Moja živila v hladilniku:\n${JSON.stringify(items)}\nDanes je ${today()}. Pripravi praktičen načrt za današnji dan in nakupovalni seznam za naslednjih 7 dni. Upoštevaj najprej živila z bližnjim rokom. Vrni JSON v obliki: {"danes":[{"obrok":"zajtrk|kosilo|večerja","ime":"...","sestavine":["..."],"manjkajo":["..."]}],"teden":[{"dan":"ponedeljek","obroki":["..."]}],"nakup":[{"izdelek":"...","kolicina":"...","kategorija":"sadje|zelenjava|meso|mlecno|shramba|pijaca|drugo"}],"nasvet":"..."}. Brez izmišljanja količin iz hladilnika.`}]);
      S.mealPlan = {...d, generatedAt:nowStr()};
      const existing = new Set(S.shopping.map(x=>String(x.name).toLowerCase()));
      arr(d.nakup).forEach(x=>{
        const name=str(x.izdelek); if(name && !existing.has(name.toLowerCase())) S.shopping.push({id:uid(),name,qty:str(x.kolicina),category:str(x.kategorija)||'drugo',done:false,source:'AI'});
      });
      save(); renderMealPlanSheet();
    }catch(e){
      $('#sheetBody').innerHTML=`<div class="sheet-h"><h2>Načrt obrokov</h2>${closeBtn}</div><div class="err">${esc(e.message || 'AI napaka')}</div><div class="sheet-f"><button class="btn wide" data-act="closeSheet">Zapri</button></div>`;
    }
  }
  function renderMealPlanSheet(){
    const p=S.mealPlan||{};
    const todayMeals=arr(p.danes);
    const week=arr(p.teden);
    const shopping=arr(p.nakup);
    let h=`<div class="sheet-h"><h2>Načrt obrokov</h2>${closeBtn}</div>`;
    if(p.nasvet) h+=`<p class="suggest">${esc(p.nasvet)}</p>`;
    h+=`<div class="rvh">Danes</div><ul class="rvl">${todayMeals.length?todayMeals.map(m=>`<li class="rv"><strong>${esc(m.obrok||'Obrok')}: ${esc(m.ime||'')}</strong><div class="small-note">${esc(arr(m.sestavine).join(', '))}</div>${arr(m.manjkajo).length?`<div class="small-note">Manjka: ${esc(arr(m.manjkajo).join(', '))}</div>`:''}</li>`).join(''):'<li class="rv">Ni predlogov.</li>'}</ul>`;
    h+=`<div class="rvh">Naslednjih 7 dni</div><ul class="rvl">${week.map(d=>`<li class="rv"><strong>${esc(d.dan||'Dan')}</strong><div class="small-note">${esc(arr(d.obroki).join(' · '))}</div></li>`).join('')}</ul>`;
    h+=`<div class="rvh">Nakupovalni seznam</div><ul class="shop-list">${shopping.map(x=>`<li><input type="checkbox" data-shop-id="${esc(x.id)}" ${x.done?'checked':''}><span class="${x.done?'done':''}">${esc(x.name)}${x.qty?` · ${esc(x.qty)}`:''}</span></li>`).join('')}</ul>`;
    h+=`<div class="sheet-f"><button class="btn wide" data-act="addShopping">Shrani nakupovalni seznam</button></div>`;
    $('#sheetBody').innerHTML=h;
  }
  document.addEventListener('change',e=>{
    const id=e.target && e.target.dataset && e.target.dataset.shopId;
    if(!id) return;
    const x=S.shopping.find(a=>a.id===id); if(x){x.done=e.target.checked;save();render();}
  });
  function addShoppingFromPlan(){
    if(!S.mealPlan) return;
    let added=0; const have=new Set(S.shopping.map(x=>String(x.name).toLowerCase()));
    arr(S.mealPlan.nakup).forEach(x=>{const name=str(x.izdelek);if(name&&!have.has(name.toLowerCase())){S.shopping.push({id:uid(),name,qty:str(x.kolicina),category:str(x.kategorija)||'drugo',done:false,source:'AI'});have.add(name.toLowerCase());added++;}});
    save();toast(added?`Dodano ${added} živil na nakupovalni seznam.`:'Nakupovalni seznam je že posodobljen.');render();
  }

  // ---- Documents: warranties, car service, vignette, contracts, etc. ----
  function openDocumentForm(existing){
    const d=existing||{};
    openSheet(`<div class="sheet-h"><h2>${d.id?'Uredi zapis':'Nov zapis'}</h2>${closeBtn}</div>
      <div class="field"><label>Vrsta</label><select id="docType" style="font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%"><option value="garancija">Garancija</option><option value="servis">Servis</option><option value="vinjeta">Vinjeta</option><option value="zavarovanje">Zavarovanje</option><option value="naročnina">Naročnina</option><option value="drugo">Drugo</option></select></div>
      <div class="field"><label>Naslov</label><input id="docTitle" value="${esc(d.title||'')}" placeholder="npr. Servis avta, garancija za TV …"></div>
      <div class="feature-grid"><div class="field"><label>Velja do</label><input type="date" id="docExpiry" value="${esc(d.expiry||'')}"></div><div class="field"><label>Opomni me</label><input type="date" id="docReminder" value="${esc(d.reminderDate||'')}"></div></div>
      <div class="field"><label>Opomba</label><textarea id="docNote" placeholder="Podrobnosti, servisni interval, številka police …">${esc(d.note||'')}</textarea></div>
      <div class="sheet-f"><button class="btn wide" data-act="saveDocument" data-id="${esc(d.id||'')}">Shrani</button>${d.id?`<button class="btn ghost wide danger" data-act="delDocument" data-id="${esc(d.id)}">Izbriši</button>`:''}</div>`,'document');
    const sel=$('#docType'); if(sel) sel.value=d.type||'drugo';
  }
  function saveDocument(id){
    const type=$('#docType').value, title=str($('#docTitle').value)||'Brez naslova', expiry=dt($('#docExpiry').value), reminder=dt($('#docReminder').value), note=str($('#docNote').value);
    if(!title){toast('Dodaj naslov zapisa.');return;}
    let d=id?S.documents.find(x=>x.id===id):null;
    if(!d){d={id:uid(),createdAt:nowStr()};S.documents.push(d)}
    Object.assign(d,{type,title,expiry,reminderDate:reminder,note});
    S.reminders=S.reminders.filter(r=>r.documentId!==d.id);
    const target=reminder||expiry;
    if(target){
      S.reminders.push({id:uid(),text:`${title}${expiry?` · rok ${fmtDate(expiry)}`:''}`,trigger:'cas',at:`${target} 08:00`,done:false,documentId:d.id});
    }
    save();sheet.close();render();toast('Zapis in opomnik sta shranjena.');
  }
  function delDocument(id){
    S.documents=S.documents.filter(d=>d.id!==id);
    S.reminders=S.reminders.filter(r=>r.documentId!==id);
    save();sheet.close();render();toast('Zapis je izbrisan.');
  }
  function renderDocuments(){
    const docs=[...S.documents].sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));
    let h=`<h2 class="sec">Garancije in pomembni roki</h2><div class="toolbar"><button class="btn" data-act="newDocument">${ic('pen',18)} Dodaj rok</button></div>`;
    if(!docs.length) return h+`<div class="empty"><p>Sem lahko shraniš garancije, servise, vinjete, zavarovanja in druge roke.</p></div>`;
    h+=`<div class="doc-list">${docs.map(d=>{const dd=d.expiry?dayDiff(d.expiry):null;const cls=dd!=null&&dd<=7?'bad':dd!=null&&dd<=30?'warn':'';return `<div class="doc"><div class="grow"><strong>${esc(d.title)}</strong><div class="meta">${esc(d.type||'drugo')}${d.expiry?' · velja do '+fmtDate(d.expiry):''}</div>${d.note?`<div class="small-note">${esc(d.note)}</div>`:''}</div>${dd!=null?`<span class="badge ${cls}">${dd<0?'poteklo':dd===0?'danes':dd===1?'jutri':'čez '+dd+' dni'}</span>`:''}<div class="actions"><button class="mini copy" data-act="editDocument" data-id="${esc(d.id)}" aria-label="Uredi">${ic('pen',18)}</button><button class="mini" data-act="delDocument" data-id="${esc(d.id)}" aria-label="Izbriši">${ic('trash',18)}</button></div></div>`}).join('')}</div>`;
    return h;
  }

  // ---- Saved receipts ----
  function openImage(src,title){
    openSheet(`<div class="sheet-h"><h2>${esc(title||'Račun')}</h2>${closeBtn}</div><img src="${esc(src)}" alt="Shranjeni račun" style="width:100%;max-height:70vh;object-fit:contain;border-radius:14px;border:1px solid var(--line)"><div class="sheet-f"><button class="btn wide" data-act="closeSheet">Zapri</button></div>`,'image');
  }
  function renderReceipts(){
    const rows=[];
    S.bills.filter(b=>b.receiptImage).forEach(b=>rows.push({id:b.id,title:b.recipient||'Položnica',date:b.due||'',amount:money(b.amount,b.currency),img:b.receiptImage}));
    S.expenses.filter(e=>e.receiptImage).forEach(e=>rows.push({id:e.id,title:e.store||'Račun',date:e.date||'',amount:money(e.total),img:e.receiptImage}));
    if(!rows.length) return '';
    rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    return `<h2 class="sec">Shranjeni računi</h2><ul class="list">${rows.slice(0,20).map(r=>`<li class="row"><img class="receipt-img" src="${esc(r.img)}" alt="Račun" data-act="viewReceipt" data-src="${esc(r.img)}" data-title="${esc(r.title)}"><div class="grow"><strong>${esc(r.title)}</strong><small>${esc(r.date)} · ${esc(r.amount)}</small></div></li>`).join('')}</ul>`;
  }

  // Capture image before the old AI apply() resets the capture buffer, then attach it to new records.
  const oldApply = A.apply;
  A.apply = function(){
    const receiptImage = cap.images && cap.images[0] ? cap.images[0].url : null;
    const oldBills=new Set(S.bills.map(x=>x.id)), oldExp=new Set(S.expenses.map(x=>x.id)), oldTasks=new Set(S.tasks.map(x=>x.id));
    oldApply();
    if(receiptImage){
      S.bills.filter(x=>!oldBills.has(x.id)).forEach(x=>x.receiptImage=receiptImage);
      S.expenses.filter(x=>!oldExp.has(x.id)).forEach(x=>x.receiptImage=receiptImage);
      const recId=uid();
      S.receipts.push({id:recId,image:receiptImage,createdAt:nowStr()});
    }
    // Tasks produced by AI with a concrete time get a matching time reminder automatically.
    S.tasks.filter(t=>!oldTasks.has(t.id) && t.time).forEach(t=>{
      const atDate=t.due||today(), at=`${atDate} ${tm(t.time)||t.time}`;
      if(!S.reminders.some(r=>r.taskId===t.id)) S.reminders.push({id:uid(),text:t.title,trigger:'cas',at,done:false,taskId:t.id});
    });
    save(); render();
  };

  // ---- Enhanced fridge view ----
  const oldRenderFridge = renderFridge;
  renderFridge = function(){
    let h=oldRenderFridge();
    h=h.replace('<div class="toolbar">', `<div class="toolbar"><button class="btn ghost" data-act="mealPlan">${ic('spark',18)} Plan danes + teden</button>`);
    if(S.shopping.length){
      const left=S.shopping.filter(x=>!x.done).length;
      h+=`<h2 class="sec">Nakupovalni seznam <span class="badge plain">${left} odprtih</span></h2><ul class="shop-list">${S.shopping.slice(-20).map(x=>`<li><input type="checkbox" data-shop-id="${esc(x.id)}" ${x.done?'checked':''}><span class="${x.done?'done':''}">${esc(x.name)}${x.qty?' · '+esc(x.qty):''}</span></li>`).join('')}</ul>`;
    }
    if(S.mealPlan && S.mealPlan.danes && S.mealPlan.danes.length){
      h+=`<div class="suggest"><strong>Danes:</strong> ${esc(arr(S.mealPlan.danes).map(x=>x.ime).filter(Boolean).join(' · '))}</div>`;
    }
    return h;
  };

  // ---- Enhanced finance view ----
  const oldRenderMoney = renderMoney;
  renderMoney = function(){
    return oldRenderMoney() + renderReceipts() + renderDocuments();
  };

  // ---- Enhanced task view ----
  const oldRenderTasks = renderTasks;
  renderTasks = function(){
    let h=`<div style="margin-bottom:12px"><button class="btn" data-act="advancedTask">${ic('spark',18)} Opravilo z opomnikom</button></div>`+oldRenderTasks();
    const loc=S.reminders.filter(r=>!r.done&&r.trigger==='lokacija');
    if(loc.length){
      h+=`<h2 class="sec">Lokacijski opomniki</h2><div class="rem-grid">${loc.map(r=>`<div class="rem-card"><strong>${esc(r.text)}</strong><div class="small-note">${esc(r.locationName||'Lokacija ni določena')}${r.radius?` · radij ${esc(r.radius)} m`:''}</div>${r.lat==null||r.lng==null?`<button class="btn sm ghost" data-act="locateReminder" data-id="${esc(r.id)}">Nastavi trenutno lokacijo</button>`:''}</div>`).join('')}</div>`;
    }
    return h;
  };

  function openAdvancedTask(){
    pendingTaskCoords=null;
    openSheet(`<div class="sheet-h"><h2>Opravilo in opomnik</h2>${closeBtn}</div>
      <div class="field"><label>Opravilo</label><input id="advTitle" placeholder="npr. oddaj paket, servis avta, pokliči dobavitelja"></div>
      <div class="field"><label>Prioriteta</label><select id="advPrio" style="font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%"><option value="visoka">Visoka</option><option value="srednja" selected>Srednja</option><option value="nizka">Nizka</option></select></div>
      <div class="feature-grid"><div class="field"><label>Datum</label><input type="date" id="advDate" value="${today()}"></div><div class="field"><label>Ura</label><input type="time" id="advTime"></div></div>
      <div class="field"><label>Lokacijski opomnik</label><input id="advLocation" placeholder="npr. Merkur Celje, pošta …"><div class="small-note">Ko boš na tej lokaciji, prejmeš opomnik. Brskalnik bo zahteval dovoljenje za lokacijo.</div><button class="btn sm ghost" data-act="captureTaskLocation">Uporabi mojo trenutno lokacijo</button><div id="advLocStatus" class="location-pill" hidden></div></div>
      <div class="field"><label>Radij opomnika</label><input type="number" id="advRadius" min="50" step="50" value="200"></div>
      <div class="sheet-f"><button class="btn wide" data-act="saveAdvancedTask">Shrani opravilo</button></div>`,'task');
  }
  function captureTaskLocation(){
    if(!navigator.geolocation){toast('Geolokacija ni podprta.');return;}
    navigator.geolocation.getCurrentPosition(pos=>{
      pendingTaskCoords={lat:pos.coords.latitude,lng:pos.coords.longitude};
      const s=$('#advLocStatus'); if(s){s.hidden=false;s.textContent=`Lokacija zajeta (${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)})`;}
    },()=>toast('Lokacije ni bilo mogoče pridobiti. Dovoli dostop do lokacije.'),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }
  function saveAdvancedTask(){
    const title=str($('#advTitle').value); if(!title){toast('Vnesi opravilo.');return;}
    const date=dt($('#advDate').value)||null, time=tm($('#advTime').value), prio=$('#advPrio').value, loc=str($('#advLocation').value), radius=num($('#advRadius').value)||200;
    const task={id:uid(),title,prio,done:false,due:date,time,frame:time?'ob določeni uri':null};
    S.tasks.push(task);
    if(time){S.reminders.push({id:uid(),text:title,trigger:'cas',at:`${date||today()} ${time}`,done:false,taskId:task.id});}
    if(loc){
      S.reminders.push({id:uid(),text:title,trigger:'lokacija',locationName:loc,lat:pendingTaskCoords?.lat??null,lng:pendingTaskCoords?.lng??null,radius,done:false,taskId:task.id});
    }
    save();sheet.close();render();toast('Opravilo in opomnik sta shranjena.');
  }
  function locateExistingReminder(id){
    const r=S.reminders.find(x=>x.id===id); if(!r || !navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(pos=>{r.lat=pos.coords.latitude;r.lng=pos.coords.longitude;save();render();toast('Lokacija opomnika je posodobljena.');},()=>toast('Lokacije ni bilo mogoče pridobiti.'),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }

  // Keep reminder/task state in sync when the user completes one of them.
  const oldDoneRem=A.doneRem;
  A.doneRem=function(b){
    oldDoneRem(b);
    const id=b?.dataset?.id;
    const r=S.reminders.find(x=>x.id===id); if(r&&r.taskId){const t=S.tasks.find(x=>x.id===r.taskId);if(t)t.done=true;save();render();}
  };
  const oldToggleTask=A.toggleTask;
  A.toggleTask=function(b){
    oldToggleTask(b);
    const id=b?.dataset?.id;
    const t=S.tasks.find(x=>x.id===id); if(t){S.reminders.filter(r=>r.taskId===id).forEach(r=>r.done=t.done);save();render();}
  };

  // Settings: append PWA/notification/location controls to the existing settings sheet.
  const oldOpenSettings=openSettings;
  openSettings=function(){
    oldOpenSettings();
    setTimeout(()=>{
      const host=$('#sheetBody'); if(!host)return;
      const p=document.createElement('div'); p.className='install-card'; p.innerHTML=`<h3>Aplikacija na telefonu</h3><p>Namesti LifeFlow AI na začetni zaslon in ga uporabljaj kot aplikacijo.</p><button id="installPwaBtn" class="btn wide" data-act="install">Namesti LifeFlow AI</button><p class="small-note">${esc(installHelp())}</p>`;
      host.appendChild(p);
      const n=document.createElement('div'); n.className='install-card'; n.innerHTML=`<h3>Opomniki</h3><p>${S.settings.notifications?'Sistemska obvestila so omogočena.':'Sistemska obvestila niso omogočena.'}</p><button class="btn ghost wide" data-act="enableNotifications">${S.settings.notifications?'Preveri obvestila':'Omogoči obvestila'}</button><div class="small-note" style="margin-top:8px">Časovni in lokacijski opomniki delujejo, ko ima brskalnik dovoljenje za obvestila in lokacijo. Delovanje v ozadju je odvisno od naprave in brskalnika.</div>`;
      host.appendChild(n);
      updateInstallAvailability();
    },0);
  };

  // New actions are added to the existing action dispatcher.
  A.install=installApp;
  A.enableNotifications=requestNotifications;
  A.mealPlan=generateMealPlan;
  A.addShopping=addShoppingFromPlan;
  A.newDocument=()=>openDocumentForm();
  A.editDocument=b=>{const d=S.documents.find(x=>x.id===b?.dataset?.id);if(d)openDocumentForm(d)};
  A.saveDocument=b=>saveDocument(b?.dataset?.id||'');
  A.delDocument=b=>delDocument(b?.dataset?.id||'');
  A.viewReceipt=b=>openImage(b?.dataset?.src||'',b?.dataset?.title||'Račun');
  A.advancedTask=openAdvancedTask;
  A.captureTaskLocation=captureTaskLocation;
  A.saveAdvancedTask=saveAdvancedTask;
  A.locateReminder=b=>locateExistingReminder(b?.dataset?.id||'');

  // Persist version marker for future upgrades.
  S.settings.schemaVersion=2;
  save();
  updateInstallAvailability();
})();

render();
</script>
</body>
</html>
